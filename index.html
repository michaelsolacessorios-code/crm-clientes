        <button type="button" class="ghost-btn" id="btnPreencherManual" style="width:100%; margin-top:10px;">Preencher manualmente (sem PDF)</button>
      </div>
      <div id="pedidoRevisaoStep" style="display:none;"></div>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="ghost-btn" id="fecharSubirPedido">Fechar</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.onclick = (e) => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.querySelector('#fecharSubirPedido').onclick = () => backdrop.remove();

  backdrop.querySelector('#btnPreencherManual').onclick = () => {
    renderRevisaoPedido({valorTotal: 0, itens: []});
  };

  backdrop.querySelector('#btnAnalisarPedido').onclick = async () => {
    const file = backdrop.querySelector('#pedidoPdfInput').files[0];
    const msg = backdrop.querySelector('#msgAnalisarPedido');
    if(!file){ msg.innerHTML = `<div class="msg err">Escolha o arquivo PDF primeiro.</div>`; return; }
    const btn = backdrop.querySelector('#btnAnalisarPedido');
    btn.disabled = true; btn.textContent = 'Lendo o pedido...';
    try{
      const resultado = await extrairPedidoDoPdf(file);
      renderRevisaoPedido(resultado);
    }catch(err){
      msg.innerHTML = `<div class="msg err">A leitura automática não está disponível nesse ambiente (${err.message}). Use "Preencher manualmente" abaixo pra lançar o pedido mesmo assim.</div>`;
    }
    btn.disabled = false; btn.textContent = 'Analisar pedido (lê o PDF automaticamente)';
  };

  function renderRevisaoPedido(resultado){
    backdrop.querySelector('#pedidoUploadStep').style.display = 'none';
    const step = backdrop.querySelector('#pedidoRevisaoStep');
    step.style.display = 'block';
    step.innerHTML = `
      <p class="hint">Confira os dados antes de confirmar — dá pra corrigir qualquer campo.</p>
      <label class="field-label">Valor total do pedido</label>
      <input type="number" id="revisaoValor" class="login-input" min="0" step="0.01" value="${resultado.valorTotal}">
      <label class="field-label">Itens / SKUs identificados</label>
      <div id="revisaoItens" style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;"></div>
      <button type="button" class="ghost-btn" id="btnAddItemPedido" style="margin-bottom:10px;">+ Adicionar item</button>
      <div id="msgConfirmarPedido"></div>
      <button class="primary-btn" id="btnConfirmarPedido" style="width:100%;">Confirmar venda</button>
    `;
    let itens = resultado.itens.length ? resultado.itens : [{codigo:'', descricao:'', quantidade:1}];

    function drawItens(){
      const wrap = step.querySelector('#revisaoItens');
      wrap.innerHTML = itens.map((it, idx) => `
        <div class="form-row" data-idx="${idx}" style="margin-bottom:0; align-items:center;">
          <input type="text" class="itemCodigo" data-idx="${idx}" placeholder="Código" value="${it.codigo||''}" style="max-width:110px;">
          <input type="text" class="itemDescricao" data-idx="${idx}" placeholder="Descrição" value="${it.descricao||''}">
          <input type="number" class="itemQuantidade" data-idx="${idx}" placeholder="Qtd" min="0" value="${it.quantidade||0}" style="max-width:80px;">
          <button type="button" class="ghost-btn removerItemBtn" data-idx="${idx}" style="padding:7px 10px; font-size:12px;">✕</button>
        </div>
      `).join('');
      wrap.querySelectorAll('.itemCodigo').forEach(inp => inp.oninput = () => { itens[Number(inp.dataset.idx)].codigo = inp.value; });
      wrap.querySelectorAll('.itemDescricao').forEach(inp => inp.oninput = () => { itens[Number(inp.dataset.idx)].descricao = inp.value; });
      wrap.querySelectorAll('.itemQuantidade').forEach(inp => inp.oninput = () => { itens[Number(inp.dataset.idx)].quantidade = Number(inp.value)||0; });
      wrap.querySelectorAll('.removerItemBtn').forEach(btn => btn.onclick = () => { itens.splice(Number(btn.dataset.idx),1); drawItens(); });
    }
    drawItens();

    step.querySelector('#btnAddItemPedido').onclick = () => { itens.push({codigo:'', descricao:'', quantidade:1}); drawItens(); };

    step.querySelector('#btnConfirmarPedido').onclick = async () => {
      const valor = Number(step.querySelector('#revisaoValor').value);
      const msgC = step.querySelector('#msgConfirmarPedido');
      if(!valor || valor <= 0){
        msgC.innerHTML = `<div class="msg err">Informe o valor total do pedido.</div>`;
        return;
      }
      const itensValidos = itens.filter(i => i.quantidade > 0);
      const qtdSkus = itensValidos.length;
      const qtdUnidades = itensValidos.reduce((soma,i) => soma + i.quantidade, 0);
      const btnConf = step.querySelector('#btnConfirmarPedido');
      btnConf.disabled = true; btnConf.textContent = 'Salvando...';
      await marcarContato(c.vendedorCodigo, codigo, 'Pedido enviado via PDF', true, valor, null, {itens: itensValidos, qtdSkus, qtdUnidades});
      backdrop.remove();
      renderVendorShell();
    };
  }
}

// Marca/desmarca um cliente como inadimplente, com observação de contato/cobrança.
// Cliente inadimplente nunca sai da carteira do vendedor — só fica destacado e sem meta de venda.
function abrirInadimplenciaModal(codigo){
  const c = STATE.roster.find(c=>c.codigo===codigo);
  if(!c) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Inadimplência do cliente</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;">${c.nome}</p>
      <div class="toggle-row" id="inadimplenteToggle">
        <button type="button" class="toggle-btn ${!c.inadimplente?'active':''}" data-val="nao">Em dia</button>
        <button type="button" class="toggle-btn ${c.inadimplente?'active':''}" data-val="sim">Inadimplente</button>
      </div>
      <label class="field-label" style="margin-top:10px;">Contato e cobrança feita</label>
      <textarea id="inadimplenteObs" placeholder="Ex: falei com o financeiro, prometeram pagar dia 10...">${c.inadimplenteObs||''}</textarea>
      <p class="hint" style="margin-top:-8px;">O valor devido ainda vai ser preenchido automaticamente quando a planilha trouxer esse dado.</p>
      <div id="msgInadimplente"></div>
      <div class="modal-actions" style="margin-top:10px;">
        <button class="ghost-btn" id="cancelarInadimplente">Cancelar</button>
        <button class="primary-btn" id="salvarInadimplente">Salvar</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  let inadimplente = !!c.inadimplente;
  const btns = backdrop.querySelectorAll('#inadimplenteToggle .toggle-btn');
  btns.forEach(btn => {
    btn.onclick = () => {
      btns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      inadimplente = btn.dataset.val === 'sim';
    };
  });
  backdrop.onclick = (e) => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.querySelector('#cancelarInadimplente').onclick = () => backdrop.remove();
  backdrop.querySelector('#salvarInadimplente').onclick = async () => {
    const obs = backdrop.querySelector('#inadimplenteObs').value.trim();
    if(inadimplente && !obs){
      backdrop.querySelector('#msgInadimplente').innerHTML = `<div class="msg err">Registre o contato/cobrança feita com o cliente.</div>`;
      return;
    }
    c.inadimplente = inadimplente;
    c.inadimplenteObs = obs;
    c.inadimplenteDesde = inadimplente ? (c.inadimplenteDesde || todayStr()) : null;
    if(c.valorDevido === undefined) c.valorDevido = null; // pronto pra receber da planilha no futuro
    await safeSet('crm:roster', STATE.roster);
    backdrop.remove();
    if(STATE.session.tipo==='vendedor') renderVendorShell(); else renderManagerShell();
  };
}

function clientRowHTML(c, status, doneToday, showDay, showCredito){
  const agendado = c.agendadoPara && c.agendadoPara > todayStr();
  const temCredito = showCredito && c.limiteCredito !== null && c.limiteCredito !== undefined;
  const comprado = temCredito ? Math.max(0, c.saldoDevedor||0) : 0;
  const disponivel = temCredito ? Math.max(0, c.limiteCredito - (c.saldoDevedor||0)) : 0;

  // Quanto o cliente já comprou este mês (via vendas registradas no CRM) — pinta a caixa de verde clarinho.
  const vendidoEsteMes = valorCompradoMesCliente(c);
  const comprouEsteMes = vendidoEsteMes > 0;

  // Inadimplência: cliente devedor nunca sai da carteira, só fica pintado de preto e sem meta de venda.
  const inadimplente = !!c.inadimplente;

  // Meta de vendas do cliente (editável) e se já bateu ou não — não se aplica a quem está inadimplente.
  const temMeta = !!c.vendedorCodigo && !inadimplente;
  const meta = temMeta ? metaClienteAtual(c) : 0;
  const bateuMeta = temMeta && vendidoEsteMes >= meta;

  return `
    <div class="client-row status-${status} ${comprouEsteMes?'comprou-mes':''} ${inadimplente?'inadimplente':''}" data-codigo="${c.codigo}">
      <div class="client-info">
        <div class="client-name client-name-link" data-codigo="${c.codigo}">${c.nome} <span class="client-num">Nº ${c.codigo}</span></div>
        <div class="client-meta">
          <span>${c.municipio || ''}${c.uf ? '/'+c.uf : ''}</span>
          ${c.contato ? `<span>${c.contato}</span>` : ''}
          ${c.telefone ? `<a href="tel:${c.telefone.replace(/\D/g,'')}">${c.telefone}</a>` : ''}
        </div>
        ${inadimplente ? `<div class="inadimplente-linha">🖤 Inadimplente${c.valorDevido ? ' — '+fmtMoney(c.valorDevido) : ''}${c.inadimplenteObs ? ' — '+c.inadimplenteObs : ''}</div>` : ''}
        ${comprouEsteMes ? `<div class="comprou-mes-linha">Comprou este mês: <b>${fmtMoney(vendidoEsteMes)}</b></div>` : ''}
        ${temCredito ? `
          <div class="credito-line">
            <span>Comprado: <b>${fmtMoney(comprado)}</b></span>
            <span>Limite: <b>${fmtMoney(c.limiteCredito)}</b></span>
            <span class="${disponivel<=0?'credito-zerado':''}">Disponível: <b>${fmtMoney(disponivel)}</b></span>
          </div>
        ` : (showCredito ? `<div class="credito-line credito-vazio">Sem dado de limite de crédito</div>` : '')}
        ${temMeta ? `
          <div class="meta-cliente-linha">
            <span class="meta-cliente-editar" data-codigo="${c.codigo}" title="Clique para editar a meta">🎯 Meta: <b>${fmtMoney(meta)}</b> ✎</span>
          </div>
        ` : ''}
        ${c.vendedorCodigo ? `
          <div class="meta-cliente-linha">
            <span class="inadimplente-editar" data-codigo="${c.codigo}" title="Clique para gerenciar inadimplência">${inadimplente ? '🖤 Gerenciar inadimplência' : '⚠️ Marcar como inadimplente'}</span>
          </div>
        ` : ''}
        ${STATE.session.tipo==='gerente' ? `
          <div class="meta-cliente-linha">
            <span class="inadimplente-editar trocar-vendedor-editar" data-codigo="${c.codigo}" title="Clique para trocar o vendedor responsável">🔁 Trocar vendedor${vendorNome(c.vendedorCodigo) ? ' (atual: '+vendorNome(c.vendedorCodigo)+')' : ''}</span>
          </div>
        ` : ''}
      </div>
      ${showDay ? `<div class="day-pill">${DIAS_CURTO[c.diaSemana] || '—'}</div>` : ''}
      ${agendado ? `<span class="agenda-pill" data-codigo="${c.codigo}" title="Clique para cancelar o agendamento">Retorno ${fmtDatePt(c.agendadoPara)} ✕</span>` : ''}
      ${temMeta ? `<span class="meta-resultado ${bateuMeta?'meta-ok':'meta-fail'}" title="${bateuMeta?'Meta batida':'Meta ainda não batida'}">${bateuMeta?'✓':'✗'}</span>` : ''}
      <span class="status-badge status-${status}">${statusLabel(c.ultimoContato)}</span>
      ${c.vendedorCodigo ? `<button class="ghost-btn subir-pedido-btn" data-codigo="${c.codigo}" style="padding:9px 12px; font-size:12px;">📄 Pedido</button>` : ''}
      <button class="check-btn ${doneToday?'done':''}" data-codigo="${c.codigo}">${doneToday ? '✓ Contatado' : 'Marcar contato'}</button>
    </div>
  `;
}

// Busca o histórico de um cliente em TODOS os vendedores (não só no vendedor atual),
// pra cobrir o caso do cliente já ter passado por outra carteira antes.
async function abrirDetalhesCliente(codigo){
  let info = STATE.roster.find(c=>c.codigo===codigo);
  let vendedorAtual = info ? STATE.vendors.find(v=>v.codigo===info.vendedorCodigo) : null;
  if(!info){
    const pool = await getInativos();
    info = pool.find(c=>c.codigo===codigo);
  }
  let entradas = [];
  for(const v of STATE.vendors){
    const contatos = await getContatos(v.codigo);
    const reg = contatos[codigo];
    if(reg && reg.historico){
      reg.historico.forEach(h => entradas.push({...h, vendedorNome: v.nome, vendedorCodigoHist: v.codigo}));
    }
  }
  // Numera os pedidos (só as entradas com venda) em ordem cronológica de lançamento — Pedido nº 1 é o mais antigo.
  const cronologica = [...entradas].sort((a,b) => a.data < b.data ? -1 : 1);
  let contadorPedido = 0;
  const numeroPorId = {};
  cronologica.forEach(e => { if(e.vendeu){ contadorPedido++; numeroPorId[e.id] = contadorPedido; } });
  entradas.sort((a,b) => a.data < b.data ? 1 : -1);

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal" style="max-width:460px; max-height:80vh; overflow-y:auto;">
      <h3>${info ? info.nome : 'Cliente'} <span class="client-num" style="font-size:0.6em;">Nº ${codigo}</span></h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5;">
        ${info ? `${info.municipio||''}${info.uf?'/'+info.uf:''}${info.contato?' · '+info.contato:''}${info.telefone?' · '+info.telefone:''}` : ''}
        ${vendedorAtual ? `<br>Vendedor responsável: <b>${vendedorAtual.nome}</b>` : (info ? '<br>Sem vendedor responsável hoje' : '')}
      </p>
      ${info ? creditoLineHTML(info) : ''}
      ${info && info.vendedorCodigo ? `<button class="primary-btn" id="btnNovoPedidoDetalhes" style="width:100%; margin-bottom:12px;">📄 Subir novo pedido</button>` : ''}
      ${entradas.length===0 ? `<div class="empty-state">Nenhum contato registrado para este cliente ainda.</div>` : `
        <div class="client-list">
          ${entradas.map(e => `
            <div class="client-row status-${e.vendeu?'ok':'warn'}" style="padding:11px 13px; flex-wrap:wrap;">
              <div class="client-info">
                <div class="client-name" style="font-size:13px;">${e.vendeu ? `Pedido nº ${numeroPorId[e.id]}` : 'Contato'} — ${e.vendedorNome}</div>
                <div class="client-meta">${e.obs ? e.obs : (e.vendeu ? 'Venda registrada' : 'Contato registrado')}</div>
                ${e.vendeu && e.skus && e.skus.itens && e.skus.itens.length ? `
                  <div class="client-meta" style="margin-top:3px;">
                    <span>Volume: <b>${e.skus.qtdUnidades ?? e.skus.itens.reduce((s,i)=>s+(i.quantidade||0),0)} un.</b></span>
                    <span>SKUs: <b>${e.skus.qtdSkus ?? e.skus.itens.length}</b></span>
                  </div>
                  <div class="client-meta" style="margin-top:2px; font-size:12px;">${e.skus.itens.map(i => `${i.codigo||i.descricao||'item'} (${i.quantidade})`).join(', ')}</div>
                ` : ''}
              </div>
              ${e.vendeu ? `<span class="status-badge status-ok">${fmtMoney(e.valor)}</span>` : ''}
              <div class="day-pill">${fmtDatePt(e.data)}</div>
              <button class="ghost-btn excluirEntradaBtn" data-id="${e.id}" data-vendedor="${e.vendedorCodigoHist}" style="color:var(--danger); border-color:var(--danger); padding:7px 10px; font-size:12px;">🗑️ Excluir</button>
            </div>
          `).join('')}
        </div>
      `}
      <div class="modal-actions" style="margin-top:16px;">
        <button class="ghost-btn" id="fecharDetalhes">Fechar</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#fecharDetalhes').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if(e.target===backdrop) backdrop.remove(); };
  const btnNovoPedido = backdrop.querySelector('#btnNovoPedidoDetalhes');
  if(btnNovoPedido) btnNovoPedido.onclick = () => { backdrop.remove(); abrirSubirPedidoModal(codigo); };
  backdrop.querySelectorAll('.excluirEntradaBtn').forEach(btn=>{
    btn.onclick = async () => {
      if(!(await confirmarAcao('Excluir esse registro do histórico? O valor sai da meta do mês. Essa ação não pode ser desfeita — depois é só usar "Subir novo pedido" se precisar lançar de novo.'))) return;
      await excluirEntradaHistorico(Number(btn.dataset.vendedor), codigo, btn.dataset.id);

}

// Modal reutilizável (vendedor ou gerente) pra buscar clientes em toda a base e vincular como mesmo grupo/CNPJ.
async function abrirModalVincularCNPJ(){
  const poolInativos = await getInativos();
  function todosOsClientesParaBusca(){
    const doRoster = STATE.roster.map(c => ({codigo:c.codigo, nome:c.nome, cnpj:c.cnpj||'', vendedorNome: (STATE.vendors.find(v=>v.codigo===c.vendedorCodigo)||{}).nome}));
    const doInativos = poolInativos.map(c => ({codigo:c.codigo, nome:c.nome, cnpj:c.cnpj||'', vendedorNome: null}));
    return [...doRoster, ...doInativos];
  }
  function nomeClientePorCodigo(codigo){
    const c = todosOsClientesParaBusca().find(c=>c.codigo===codigo);
    return c ? c.nome : ('Cliente Nº '+codigo);
  }

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal" style="max-width:480px; max-height:82vh; overflow-y:auto;">
      <h3>Vincular clientes do mesmo grupo</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5;">Se dois ou mais CNPJs são na prática o mesmo cliente, vincule eles aqui. A partir daí, toda venda registrada pra qualquer um divide o valor entre todos e marca todos como contatados no dia — mesmo que sejam de vendedores diferentes.</p>
      <input type="text" class="search-input" id="buscaVinculoModal" placeholder="Buscar por nome, CNPJ ou nº..." style="margin-bottom:10px;">
      <div id="resultadoBuscaVinculoModal" style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;"></div>
      <button class="primary-btn" id="btnCriarVinculoModal" style="display:none;">Vincular selecionados</button>
      <div id="msgVinculoModal"></div>
      <div id="listaVinculosModal" style="margin-top:16px;"></div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="ghost-btn" id="fecharVinculoModal">Fechar</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.onclick = (e) => { if(e.target===backdrop) backdrop.remove(); };
  backdrop.querySelector('#fecharVinculoModal').onclick = () => backdrop.remove();

  const selecionados = new Set();
  const buscaInput = backdrop.querySelector('#buscaVinculoModal');
  const resultadoDiv = backdrop.querySelector('#resultadoBuscaVinculoModal');
  const btnCriar = backdrop.querySelector('#btnCriarVinculoModal');

  function drawBusca(){
    const q = buscaInput.value.trim().toLowerCase();
    if(!q){ resultadoDiv.innerHTML = ''; return; }
    const encontrados = todosOsClientesParaBusca().filter(c =>
      c.nome.toLowerCase().includes(q) || (c.cnpj||'').includes(q) || String(c.codigo).includes(q)
    ).slice(0,15);
    if(encontrados.length===0){ resultadoDiv.innerHTML = `<div class="hint">Nenhum cliente encontrado.</div>`; return; }
    resultadoDiv.innerHTML = encontrados.map(c => `
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 8px; border:1px solid var(--border); border-radius:7px; cursor:pointer;">
        <input type="checkbox" class="chkVinculoModal" value="${c.codigo}" ${selecionados.has(c.codigo)?'checked':''}>
        <span>${c.nome} <span class="client-num">Nº ${c.codigo}</span>${c.cnpj?' · CNPJ '+c.cnpj:''}${c.vendedorNome?' · '+c.vendedorNome:' · sem vendedor'}</span>
      </label>
    `).join('');
    resultadoDiv.querySelectorAll('.chkVinculoModal').forEach(chk => {
      chk.onchange = () => {
        const codigo = Number(chk.value);
        if(chk.checked) selecionados.add(codigo); else selecionados.delete(codigo);
        btnCriar.style.display = selecionados.size >= 2 ? 'inline-block' : 'none';
      };
    });
  }
  buscaInput.oninput = drawBusca;

  function drawListaVinculos(){
    const listaDiv = backdrop.querySelector('#listaVinculosModal');
    if((STATE.grupos||[]).length === 0){
      listaDiv.innerHTML = `<p class="hint">Nenhum vínculo criado ainda.</p>`;
      return;
    }
    listaDiv.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:8px;">Vínculos ativos</div>` + STATE.grupos.map(g => `
      <div style="border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px;">
        <div style="font-size:12.5px; margin-bottom:6px;">${g.membros.map(m=>`${nomeClientePorCodigo(m)} <span class="client-num">Nº ${m}</span>`).join(' + ')}</div>
        <button class="ghost-btn desfazerVinculoModalBtn" data-grupo="${g.id}" style="color:var(--danger); border-color:var(--danger); padding:6px 10px; font-size:12px;">Desfazer vínculo</button>
      </div>
    `).join('');
    listaDiv.querySelectorAll('.desfazerVinculoModalBtn').forEach(btn => {
      btn.onclick = async () => {
        if(!(await confirmarAcao('Desfazer esse vínculo? As vendas passadas já registradas continuam como estão.'))) return;
        STATE.grupos = STATE.grupos.filter(g => g.id !== btn.dataset.grupo);
        await safeSet('crm:grupos', STATE.grupos);
        drawListaVinculos();
      };
    });
  }
  drawListaVinculos();

  btnCriar.onclick = async () => {
    const msg = backdrop.querySelector('#msgVinculoModal');
    const membros = Array.from(selecionados);
    if(membros.length < 2){ msg.innerHTML = `<div class="msg err">Selecione ao menos 2 clientes.</div>`; return; }
    let membrosFinais = new Set(membros);
    STATE.grupos = (STATE.grupos||[]).filter(g => {
      const temIntersecao = g.membros.some(m => membrosFinais.has(m));
      if(temIntersecao){ g.membros.forEach(m => membrosFinais.add(m)); return false; }
      return true;
    });
    STATE.grupos.push({id:'g'+Date.now(), membros: Array.from(membrosFinais)});
    await safeSet('crm:grupos', STATE.grupos);
    msg.innerHTML = `<div class="msg ok">Vínculo criado entre ${membrosFinais.size} clientes.</div>`;
    selecionados.clear();
    buscaInput.value = '';
    resultadoDiv.innerHTML = '';
    btnCriar.style.display = 'none';
    drawListaVinculos();
  };
}

// Distribui a meta mensal (R$) do vendedor entre os clientes da carteira dele, proporcional
// ao limite de crédito de cada um (quem tem limite maior recebe fatia maior da meta).
// Clientes sem limite cadastrado entram com um peso mínimo, só pra não ficarem de fora da conta.
// Clientes inadimplentes ficam sem meta (mesma regra que já existia pra meta individual).
function distribuirMetaClientesPorLimite(vendedorCodigo, metaTotal){
  const clientes = clientsForVendor(vendedorCodigo).filter(c => !c.inadimplente);
  if(clientes.length === 0) return;
  const PESO_MINIMO = 1000;
  const pesos = clientes.map(c => (c.limiteCredito && c.limiteCredito > 0) ? c.limiteCredito : PESO_MINIMO);
  const somaPesos = pesos.reduce((a,b)=>a+b, 0);
  if(somaPesos <= 0) return;
  clientes.forEach((c, i) => {
    const parte = (metaTotal||0) * (pesos[i] / somaPesos);
    c.metaCliente = Math.max(100, Math.round(parte / 50) * 50);
  });
}

function vendorStats(codigo){
  const clientes = clientsForVendor(codigo);
  const contatos = STATE.contatosCache[codigo] || {};
  const emDia = clientes.filter(c => statusFor(contatos[c.codigo]?.ultimoContato) === 'ok').length;
  const atencao = clientes.filter(c => statusFor(contatos[c.codigo]?.ultimoContato) === 'warn').length;
  const atrasados = clientes.filter(c => statusFor(contatos[c.codigo]?.ultimoContato) === 'danger').length;
  const wd = todayWeekday();
  const hojeList = wd ? clientes.filter(c=>c.diaSemana===wd) : [];
  const hojeFeitos = hojeList.filter(c => contatos[c.codigo]?.ultimoContato === todayStr()).length;
  return {total: clientes.length, emDia, atencao, atrasados, hojeTotal: hojeList.length, hojeFeitos};
}

      </select>

  `;
  document.getElementById('seletorMesVendedor').onchange = (e) => {

    renderManagerShell();
  };
  async function draw(){
    const codigo = Number(document.getElementById('selVendor').value);
    STATE.route = {page:'vendedores', codigo};
    await getContatos(codigo);
    const contatos = STATE.contatosCache[codigo] || {};

    document.getElementById('vendorSummary').innerHTML = `
      <div class="progress-row">
        <div class="stat-card"><div class="num display">${m.pctMeta}%</div><div class="label">Meta de contato (${m.contatadosMes}/${m.totalClientes})</div></div>
        <div class="stat-card ok"><div class="num display">${fmtMoney(m.valorVendas)}</div><div class="label">Vendido de ${fmtMoney(m.metaVendas)} de meta (${m.pctMetaVendas}%)</div></div>

      </div>
    `;
    const q = document.getElementById('busca').value.trim().toLowerCase();
    const f = document.getElementById('filtroStatus').value;
    const fc = document.getElementById('filtroCompra').value;
    let list = clientsForVendor(codigo).map(c => ({...c, ultimoContato: contatos[c.codigo]?.ultimoContato}));
    list = list.filter(c => {
      const matchQ = !q || c.nome.toLowerCase().includes(q) || String(c.codigo).includes(q);
      const st = statusFor(c.ultimoContato);
      const matchF = !f || st===f;
      const comprouMes = valorCompradoMesCliente(c) > 0;
      const matchFc = !fc || (fc==='comprou' ? comprouMes : !comprouMes);
      return matchQ && matchF && matchFc;
    });
    list.sort((a,b) => daysBetween(b.ultimoContato) - daysBetween(a.ultimoContato));
    const lista = document.getElementById('lista');
    lista.innerHTML = list.length===0 ? `<div class="empty-state">Nenhum cliente.</div>` :
      list.map(c => clientRowHTML(c, statusFor(c.ultimoContato), c.ultimoContato===todayStr(), true, true)).join('');
    bindClientRows(lista);
  }
  document.getElementById('selVendor').onchange = draw;
  document.getElementById('busca').oninput = draw;
  document.getElementById('filtroStatus').onchange = draw;
  document.getElementById('filtroCompra').onchange = draw;
  draw();
}

      if(!d) return;
      const novoNome = document.querySelector(`.diretorNomeInput[data-id="${id}"]`).value.trim();

      if(!novoNome || !novoUsuario || !novaSenha){
        msg.innerHTML = `<div class="msg err">Nome, usuário e senha são obrigatórios.</div>`;

      }
      const conflito = STATE.vendors.some(v=>v.usuario===novoUsuario) ||
        (STATE.config.usuarioGerente||GERENTE_USUARIO_PADRAO)===novoUsuario ||
        STATE.diretores.some(o=>o.id!==id && o.usuario===novoUsuario);
      if(conflito){
        msg.innerHTML = `<div class="msg err">Esse usuário já está em uso por outra conta.</div>`;
        return;
      }
      d.nome = novoNome; d.usuario = novoUsuario; d.senha = novaSenha;
      await safeSet('crm:diretores', STATE.diretores);
      msg.innerHTML = `<div class="msg ok">Dados de ${d.nome} atualizados.</div>`;
    };
  });
  document.querySelectorAll('.removerDiretorBtn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const d = STATE.diretores.find(d=>d.id===id);
      if(!d) return;
      if(!(await confirmarAcao(`Remover o acesso de ${d.nome}?`))) return;
      STATE.diretores = STATE.diretores.filter(o=>o.id!==id);
      await safeSet('crm:diretores', STATE.diretores);
      renderManagerShell();
    };
  });
  document.getElementById('btnAddDiretor').onclick = async () => {
    const nome = document.getElementById('novoDiretorNome').value.trim();
    const usuario = document.getElementById('novoDiretorUsuario').value.trim().toLowerCase();
    const senha = document.getElementById('novoDiretorSenha').value.trim();
    const msg = document.getElementById('msgNovoDiretor');
    if(!nome || !usuario || !senha){
      msg.innerHTML = `<div class="msg err">Preencha nome, usuário e senha.</div>`;
      return;
    }
    const conflito = STATE.vendors.some(v=>v.usuario===usuario) ||
      (STATE.config.usuarioGerente||GERENTE_USUARIO_PADRAO)===usuario ||
      STATE.diretores.some(o=>o.usuario===usuario);
    if(conflito){
      msg.innerHTML = `<div class="msg err">Já existe uma conta com esse usuário.</div>`;
      return;
    }
    STATE.diretores.push({id:'dir'+Date.now(), nome, cargo:'Diretor', usuario, senha});
    await safeSet('crm:diretores', STATE.diretores);
    msg.innerHTML = `<div class="msg ok">${nome} cadastrado como diretor.</div>`;
    renderManagerShell();
  };
  document.getElementById('btnSalvarSenhaGerente').onclick = async () => {
    const senha = document.getElementById('novaSenhaGerente').value.trim();
    const nome = document.getElementById('novoNomeGerente').value.trim();
    const cargo = document.getElementById('novoCargoGerente').value.trim();
    const usuario = document.getElementById('novoUsuarioGerente').value.trim().toLowerCase();
    const msg = document.getElementById('msgGerente');
    if(!senha || !usuario){
      msg.innerHTML = `<div class="msg err">Usuário e senha são obrigatórios.</div>`;
      return;
    }
    if(STATE.vendors.some(v=>v.usuario===usuario)){
      msg.innerHTML = `<div class="msg err">Esse usuário já pertence a um vendedor.</div>`;
      return;
    }
    STATE.config.senhaGerente = senha;
    STATE.config.usuarioGerente = usuario;
    if(nome) STATE.config.nomeGerente = nome;
    if(cargo) STATE.config.cargoGerente = cargo;
    STATE.session.nome = STATE.config.nomeGerente;
    await safeSet('crm:config', STATE.config);
    msg.innerHTML = `<div class="msg ok">Dados do gerente atualizados.</div>`;
  };
}

    <div class="admin-section-title" style="color:var(--danger); border-top-color:var(--danger);">⚠️ Zona de risco</div>

    <div class="panel" style="border-color:var(--danger); background:var(--danger-soft);">
      <h3 style="color:var(--danger);">Zerar atividade</h3>
      <p class="hint">Apaga <b>todo o histórico de contatos e vendas</b> de todos os vendedores, e desfaz <b>todos os vínculos de CNPJ</b>. Os vendedores voltam a ver a carteira "zerada" — como se ainda não tivessem contatado ninguém este mês. <b>Os clientes continuam nas carteiras</b> (nome, CNPJ, limite de crédito, metas e inadimplência não são afetados). <b>Essa ação não pode ser desfeita.</b></p>
      <button class="ghost-btn" id="btnResetarOperacional" style="color:var(--danger); border-color:var(--danger);">Zerar vendas, contatos e vínculos</button>
      <div id="msgResetarOperacional"></div>
    </div>

    <div class="panel" style="border-color:var(--danger); background:var(--danger-soft);">
      <h3 style="color:var(--danger);">⚠️ Zerar base completa de clientes</h3>
      <p class="hint">Ainda mais forte que o botão de cima. Apaga <b>todos os clientes</b> de todas as carteiras, <b>a fila inteira de "Clientes inativos"</b>, <b>todos os leads</b>, desfaz os <b>vínculos de CNPJ</b> e zera <b>todo o histórico de contatos/vendas</b>. Use isso quando for reimportar a base do zero com planilhas corretas. <b>Vendedores, senhas, contas e metas continuam intactos</b> — só os dados de clientes somem. <b>Essa ação não pode ser desfeita.</b></p>
      <button class="ghost-btn" id="btnZerarBaseCompleta" style="color:var(--danger); border-color:var(--danger); font-weight:700;">Zerar base completa de clientes</button>
      <div id="msgZerarBaseCompleta"></div>
    </div>
  `;

  const renameList = document.getElementById('renameList');
  renameList.innerHTML = STATE.vendors.map(v => {
    const numClientes = clientsForVendor(v.codigo).length;
    const foto = vendorPhotoSrc(v);
    return `
    <div class="form-row" data-codigo="${v.codigo}" style="align-items:center;">
      ${foto ? `<img src="${foto}" alt="${v.nome}" style="width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0;">` : `<div class="whoami-avatar whoami-avatar-fallback" style="width:32px; height:32px; flex-shrink:0; background:var(--border); color:var(--ink-faint);">${v.nome[0].toUpperCase()}</div>`}
      <input type="number" value="${v.codigo>0?v.codigo:''}" data-codigo="${v.codigo}" class="renameNumeroInput" placeholder="Nº" style="max-width:80px;">
      <input type="text" value="${v.nome}" data-codigo="${v.codigo}" class="renameInput" placeholder="Nome">
      <input type="text" value="${v.usuario}" data-codigo="${v.codigo}" class="renameUserInput" placeholder="usuário">
      <input type="file" accept="image/*" data-codigo="${v.codigo}" class="renameFotoInput" style="max-width:150px; font-size:11px;">
      <span style="font-size:12px; color:var(--ink-faint); white-space:nowrap;">${numClientes} cliente(s)</span>
      <button type="button" class="ghost-btn esvaziarCarteiraBtn" data-codigo="${v.codigo}" style="color:var(--warn); border-color:var(--warn);">Esvaziar carteira</button>
      <button type="button" class="ghost-btn excluirVendedorBtn" data-codigo="${v.codigo}" style="color:var(--danger); border-color:var(--danger);">Excluir</button>
    </div>
  `;}).join('') + `<button class="ghost-btn" id="btnSalvarNomes">Salvar</button><div id="msgNomes"></div>`;
  document.getElementById('btnSalvarNomes').onclick = async () => {
    const msgNomes = document.getElementById('msgNomes');
    const numerosUsados = new Set();
    let numeroInvalido = false;
    document.querySelectorAll('.renameNumeroInput').forEach(inp => {
      const val = inp.value.trim();
      if(val){
        const n = Number(val);
        if(numerosUsados.has(n)) numeroInvalido = true;
        numerosUsados.add(n);
      }
    });
    if(numeroInvalido){
      msgNomes.innerHTML = `<div class="msg err">Dois vendedores não podem ter o mesmo número.</div>`;
      return;
    }
    // Aplica nome e usuário primeiro (casando pelo código original de cada linha).
    const linhas = document.querySelectorAll('#renameList .form-row');
    linhas.forEach(linha => {
      const codigoOriginal = Number(linha.dataset.codigo);
      const v = STATE.vendors.find(v=>v.codigo===codigoOriginal);
      if(!v) return;
      v.nome = linha.querySelector('.renameInput').value.trim() || v.nome;
      v.usuario = (linha.querySelector('.renameUserInput').value.trim() || v.usuario).toLowerCase();
    });
    // Só depois troca os números, já que trocar antes quebraria o casamento acima.
    linhas.forEach(linha => {
      const codigoOriginal = Number(linha.dataset.codigo);
      const v = STATE.vendors.find(v=>v.codigo===codigoOriginal);
      const val = linha.querySelector('.renameNumeroInput').value.trim();
      if(v && val) v.codigo = Number(val);
    });
    await safeSet('crm:vendors', STATE.vendors);
    msgNomes.innerHTML = `<div class="msg ok">Atualizado.</div>`;
    renderManagerAdmin(main);
  };
  document.querySelectorAll('.renameFotoInput').forEach(inp => {
    inp.onchange = async () => {
      const file = inp.files[0];
      if(!file) return;
      const codigo = Number(inp.dataset.codigo);
      const v = STATE.vendors.find(v=>v.codigo===codigo);
      if(!v) return;
      try{
        v.foto = await resizeImagemParaBase64(file);
        await safeSet('crm:vendors', STATE.vendors);
        renderManagerAdmin(main);
      }catch(err){
        document.getElementById('msgNomes').innerHTML = `<div class="msg err">Não consegui processar essa imagem.</div>`;
      }
    };
  });
  document.querySelectorAll('.esvaziarCarteiraBtn').forEach(btn => {
    btn.onclick = async () => {
      const codigo = Number(btn.dataset.codigo);
      const v = STATE.vendors.find(v=>v.codigo===codigo);
      const numClientes = clientsForVendor(codigo).length;
      if(numClientes === 0){
        document.getElementById('msgNomes').innerHTML = `<div class="msg ok">${v.nome} já está sem clientes na carteira.</div>`;
        return;
      }
      const confirmou = await confirmarAcao(`Isso vai mover TODOS os ${numClientes} cliente(s) de ${v.nome} pra fila de "Clientes inativos". Ninguém é apagado — só desvinculado. Depois é só usar "Importar em lote" pra subir a base nova pra ele. Continuar?`);
      if(!confirmou) return;
      const resultado = await esvaziarCarteiraDoVendedor(codigo);
      document.getElementById('msgNomes').innerHTML = `<div class="msg ok">${resultado.movidos} cliente(s) de ${v.nome} foram movidos pra "Clientes inativos".</div>`;
      renderManagerAdmin(main);
    };
  });
  document.querySelectorAll('.excluirVendedorBtn').forEach(btn => {
    btn.onclick = async () => {
      const codigo = Number(btn.dataset.codigo);
      const v = STATE.vendors.find(v=>v.codigo===codigo);
      const numClientes = clientsForVendor(codigo).length;
      if(numClientes > 0){
        document.getElementById('msgNomes').innerHTML = `<div class="msg err">${v.nome} tem ${numClientes} cliente(s) na carteira. Reatribua esses clientes antes de excluir (pela tela "Vendedores" ou movendo pra "Clientes inativos").</div>`;
        return;
      }
      if(!(await confirmarAcao(`Excluir o vendedor ${v.nome}? Essa ação não pode ser desfeita.`))) return;
      STATE.vendors = STATE.vendors.filter(x=>x.codigo!==codigo);
      await safeSet('crm:vendors', STATE.vendors);
      renderManagerAdmin(main);
    };
  });
  document.getElementById('btnAddVendedor').onclick = async () => {
    const msg = document.getElementById('msgAddVendedor');
    const nome = document.getElementById('f_novo_nome').value.trim();
    const numeroVal = document.getElementById('f_novo_numero').value.trim();
    const usuario = document.getElementById('f_novo_usuario').value.trim().toLowerCase();
    const senha = document.getElementById('f_novo_senha').value.trim();
    const fotoFile = document.getElementById('f_novo_foto').files[0];
    if(!nome || !numeroVal || !usuario || !senha){
      msg.innerHTML = `<div class="msg err">Preencha nome, número, usuário e senha.</div>`;
      return;
    }
    const numero = Number(numeroVal);
    if(STATE.vendors.some(v=>v.usuario===usuario)){
      msg.innerHTML = `<div class="msg err">Já existe um vendedor com esse usuário.</div>`;
      return;
    }
    if(STATE.vendors.some(v=>v.codigo===numero)){
      msg.innerHTML = `<div class="msg err">Já existe um vendedor com esse número.</div>`;
      return;
    }
    const novoVendedor = {codigo: numero, nome, usuario, senha, metaMes: META_PADRAO};
    if(fotoFile){
      try{
        novoVendedor.foto = await resizeImagemParaBase64(fotoFile);
      }catch(err){
        msg.innerHTML = `<div class="msg err">Não consegui processar a foto — cadastrado sem foto.</div>`;
      }
    }
    STATE.vendors.push(novoVendedor);
    await safeSet('crm:vendors', STATE.vendors);
    msg.innerHTML = `<div class="msg ok">${nome} (Nº ${numero}) cadastrado.</div>`;
    ['f_novo_nome','f_novo_numero','f_novo_usuario','f_novo_senha'].forEach(id=>document.getElementById(id).value='');
    renderManagerAdmin(main);
  };

  document.getElementById('btnAddCliente').onclick = async () => {
    const nome = document.getElementById('f_nome').value.trim();
    const msg = document.getElementById('msgAdd');
    if(!nome){ msg.innerHTML = `<div class="msg err">Informe o nome do cliente.</div>`; return; }
    const vendedorCodigo = Number(document.getElementById('f_vendedor').value);
    const existentes = clientsForVendor(vendedorCodigo).length;
    const limiteVal = document.getElementById('f_limite').value;
    const saldoVal = document.getElementById('f_saldo').value;
    const novo = {
      id: 'c'+Date.now(),
      codigo: Date.now(),
      nome,
      municipio: document.getElementById('f_municipio').value.trim(),
      uf: document.getElementById('f_uf').value.trim(),
      telefone: document.getElementById('f_telefone').value.trim(),
      contato: document.getElementById('f_contato').value.trim(),
      vendedorCodigo,
      diaSemana: (existentes % 5) + 1,
      limiteCredito: limiteVal ? Number(limiteVal) : null,
      saldoDevedor: saldoVal ? Number(saldoVal) : null,
    };
    STATE.roster.push(novo);
    await safeSet('crm:roster', STATE.roster);
    msg.innerHTML = `<div class="msg ok">Cliente adicionado.</div>`;
    ['f_nome','f_municipio','f_uf','f_telefone','f_contato','f_limite','f_saldo'].forEach(id=>document.getElementById(id).value='');
  };

  document.getElementById('btnResetarOperacional').onclick = async () => {
    const msg = document.getElementById('msgResetarOperacional');
    const passo1 = await confirmarAcao('Isso vai apagar TODO o histórico de contatos e vendas de TODOS os vendedores, e desfazer todos os vínculos de CNPJ. Os clientes continuam nas carteiras. Essa ação não pode ser desfeita. Quer mesmo continuar?');
    if(!passo1) return;
    const passo2 = await confirmarAcao('Tem certeza mesmo? Os vendedores vão ver a carteira toda "zerada" a partir de agora, como se nunca tivessem contatado ninguém. Confirma de novo pra prosseguir.');
    if(!passo2) return;
    msg.innerHTML = `<div class="hint">Zerando...</div>`;
    await resetarOperacional();
    msg.innerHTML = `<div class="msg ok">Pronto. Vendas, contatos e vínculos foram zerados. Os vendedores começam do zero a partir de hoje.</div>`;
  };

  document.getElementById('btnZerarBaseCompleta').onclick = async () => {
    const msg = document.getElementById('msgZerarBaseCompleta');
    const passo1 = await confirmarAcao('Isso vai apagar TODOS os clientes de TODAS as carteiras, toda a fila de "Clientes inativos", todos os leads, desfazer vínculos de CNPJ e zerar todo o histórico. Vendedores, senhas e metas continuam intactos. Essa ação NÃO pode ser desfeita. Quer mesmo continuar?');
    if(!passo1) return;
    const passo2 = await confirmarAcao('Confirma de novo: a base de clientes inteira vai ficar vazia, pronta pra você importar as planilhas corretas do zero. Tem certeza?');
    if(!passo2) return;
    msg.innerHTML = `<div class="hint">Zerando a base completa...</div>`;
    await zerarBaseCompleta();
    msg.innerHTML = `<div class="msg ok">Pronto. A base de clientes está totalmente vazia — pode importar as planilhas corretas agora.</div>`;
    renderManagerAdmin(main);
  };

  // ---- Vincular CNPJs ----
  function todosOsClientesParaBusca(){
    const doRoster = STATE.roster.map(c => ({codigo:c.codigo, nome:c.nome, cnpj:c.cnpj||'', vendedorNome: (STATE.vendors.find(v=>v.codigo===c.vendedorCodigo)||{}).nome}));
    const doInativos = poolInativos.map(c => ({codigo:c.codigo, nome:c.nome, cnpj:c.cnpj||'', vendedorNome: null}));
    return [...doRoster, ...doInativos];
  }
  function nomeClientePorCodigo(codigo){
    const c = todosOsClientesParaBusca().find(c=>c.codigo===codigo);
    return c ? c.nome : ('Cliente Nº '+codigo);
  }

  const selecionadosVinculo = new Set();
  const buscaVinculoInput = document.getElementById('buscaVinculo');
  const resultadoDiv = document.getElementById('resultadoBuscaVinculo');
  const btnCriarVinculo = document.getElementById('btnCriarVinculo');

  function drawBuscaVinculo(){
    const q = buscaVinculoInput.value.trim().toLowerCase();
    if(!q){ resultadoDiv.innerHTML = ''; return; }
    const todos = todosOsClientesParaBusca();
    const encontrados = todos.filter(c =>
      c.nome.toLowerCase().includes(q) || (c.cnpj||'').includes(q) || String(c.codigo).includes(q)
    ).slice(0,15);
    if(encontrados.length===0){ resultadoDiv.innerHTML = `<div class="hint">Nenhum cliente encontrado.</div>`; return; }
    resultadoDiv.innerHTML = encontrados.map(c => `
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 8px; border:1px solid var(--border); border-radius:7px; cursor:pointer;">
        <input type="checkbox" class="chkVinculo" value="${c.codigo}" ${selecionadosVinculo.has(c.codigo)?'checked':''}>
        <span>${c.nome} <span class="client-num">Nº ${c.codigo}</span>${c.cnpj?' · CNPJ '+c.cnpj:''}${c.vendedorNome?' · '+c.vendedorNome:' · sem vendedor'}</span>
      </label>
    `).join('');
    resultadoDiv.querySelectorAll('.chkVinculo').forEach(chk => {
      chk.onchange = () => {
        const codigo = Number(chk.value);
        if(chk.checked) selecionadosVinculo.add(codigo); else selecionadosVinculo.delete(codigo);
        btnCriarVinculo.style.display = selecionadosVinculo.size >= 2 ? 'inline-block' : 'none';
      };
    });
  }
  buscaVinculoInput.oninput = drawBuscaVinculo;

  btnCriarVinculo.onclick = async () => {
    const msg = document.getElementById('msgVinculo');
    const membros = Array.from(selecionadosVinculo);
    if(membros.length < 2){ msg.innerHTML = `<div class="msg err">Selecione ao menos 2 clientes.</div>`; return; }
    // Se algum dos selecionados já está em outro grupo, funde os grupos.
    let membrosFinais = new Set(membros);
    STATE.grupos = (STATE.grupos||[]).filter(g => {
      const temIntersecao = g.membros.some(m => membrosFinais.has(m));
      if(temIntersecao){ g.membros.forEach(m => membrosFinais.add(m)); return false; }
      return true;
    });
    STATE.grupos.push({id:'g'+Date.now(), membros: Array.from(membrosFinais)});
    await safeSet('crm:grupos', STATE.grupos);
    msg.innerHTML = `<div class="msg ok">Vínculo criado entre ${membrosFinais.size} clientes.</div>`;
    selecionadosVinculo.clear();
    buscaVinculoInput.value = '';
    renderManagerAdmin(main);
  };

  const listaVinculosDiv = document.getElementById('listaVinculos');
  if((STATE.grupos||[]).length === 0){
    listaVinculosDiv.innerHTML = `<p class="hint">Nenhum vínculo criado ainda.</p>`;
  } else {
    listaVinculosDiv.innerHTML = `<h3 style="margin-bottom:10px;">Vínculos ativos</h3>` + STATE.grupos.map(g => `
      <div class="panel" style="padding:14px 16px; margin-bottom:10px;" data-grupo="${g.id}">
        <div style="font-size:13px; margin-bottom:8px;">${g.membros.map(m=>`${nomeClientePorCodigo(m)} <span class="client-num">Nº ${m}</span>`).join(' &nbsp;+&nbsp; ')}</div>
        <button class="ghost-btn desfazerVinculoBtn" data-grupo="${g.id}" style="color:var(--danger); border-color:var(--danger);">Desfazer vínculo</button>
      </div>
    `).join('');
    listaVinculosDiv.querySelectorAll('.desfazerVinculoBtn').forEach(btn => {
      btn.onclick = async () => {
        if(!(await confirmarAcao('Desfazer esse vínculo? As vendas passadas já registradas continuam como estão.'))) return;
        STATE.grupos = STATE.grupos.filter(g => g.id !== btn.dataset.grupo);
        await safeSet('crm:grupos', STATE.grupos);
        renderManagerAdmin(main);
      };
    });
  }
}

function renderManagerImportacoes(main){

    <p style="font-size:13px; color:var(--ink-soft); margin-bottom:20px;">Sempre nessa ordem, se for atualizar tudo de uma vez: inadimplentes → base completa → base por vendedor → base de SKU.</p>

      </div>
      <div id="msgInadimplenciaImport"></div>
    </div>

    <div class="panel import-panel" style="border-left-color:var(--primary);">
      <div class="import-panel-title"><span class="import-badge" style="background:var(--primary);">2</span><h3>Base completa de clientes</h3></div>
      <p class="hint">Suba aqui a planilha .xlsx completa da empresa (o mesmo arquivo "clientes.xlsx" de sempre), semanal ou mensalmente, pra manter a base em dia. Cliente novo entra <b>direto na carteira do vendedor</b> indicado na coluna "Vendedor" da planilha, se esse vendedor já existir cadastrado no CRM. Se não existir, vai pra fila de "Clientes inativos".</p>

      <label style="display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:14px; cursor:pointer; background:var(--bg);">

          Marcando: quem está na carteira de um vendedor mas <b>sumiu da planilha</b> pra ele volta pra "Clientes inativos", e quem está com o <b>vendedor errado</b> é corrigido automaticamente. Use isso quando a planilha for a fonte da verdade de quem é de quem — evita duplicação. Ninguém é apagado, só desvinculado.
        </span>
      </label>
      <div class="form-row" style="align-items:center;">
        <input type="file" id="f_base_completa" accept=".xlsx,.xls">
        <button class="ghost-btn" id="btnProcessarBase">Processar planilha</button>
      </div>
      <div id="msgBaseCompleta"></div>
    </div>

    <div class="panel import-panel" style="border-left-color:var(--ok);">
      <div class="import-panel-title"><span class="import-badge" style="background:var(--ok);">3</span><h3>Base por vendedor</h3></div>
      <p class="hint">Cole linhas copiadas do Excel, uma por cliente, nesta ordem separada por TAB: <b>Nome — Telefone — Contato — Município — UF</b>. Escolha o vendedor abaixo — os dias da semana são distribuídos automaticamente entre os clientes dele.</p>
      <div class="form-row">
        <select id="f_vendedor_import">${STATE.vendors.map(v=>`<option value="${v.codigo}">${v.nome} (Nº ${vendorNumero(v)})</option>`).join('')}</select>
        <button type="button" class="ghost-btn" id="btnEsvaziarAntesImport" style="color:var(--warn); border-color:var(--warn);">🗑️ Esvaziar carteira desse vendedor antes</button>
      </div>
      <textarea class="import-area" id="importArea" placeholder="Cole aqui as linhas coladas do Excel..."></textarea>
      <button class="primary-btn" id="btnImport">Importar clientes</button>
      <div id="msgImport"></div>
    </div>

    <div class="panel import-panel" style="border-left-color:var(--accent);">
      <div class="import-panel-title"><span class="import-badge" style="background:var(--accent);">4</span><h3>Base de SKU (catálogo de produtos)</h3></div>
      <p class="hint">Suba aqui a lista completa dos seus produtos — colunas nessa ordem: <b>Código</b>, <b>Descrição</b>, <b>Estoque</b> (opcional). Isso alimenta o botão "Baixar SKUs não vendidos" no dashboard de cada vendedor, mostrando o que ele ainda não vendeu esse mês e quanto tem disponível pra oferecer. Toda vez que subir de novo, substitui o catálogo inteiro pelo mais recente.</p>
      <p class="hint">${(STATE.catalogoSkus||[]).length > 0 ? `Catálogo atual: <b>${STATE.catalogoSkus.length} SKU(s)</b> cadastrados.` : 'Nenhum catálogo cadastrado ainda.'}</p>
      <div class="form-row" style="align-items:center;">
        <input type="file" id="f_catalogo_skus" accept=".xlsx,.xls">
        <button class="ghost-btn" id="btnProcessarCatalogo">Atualizar catálogo</button>
      </div>
      <div id="msgCatalogoSkus"></div>
    </div>

    <div class="panel" style="border-color:var(--warn); background:var(--warn-soft);">
      <h3 style="color:var(--warn);">🔧 Corrigir vendedor errado / duplicata</h3>
      <p class="hint">Ferramenta de correção — use quando algum cliente ficou na carteira errada, duplicado, ou preso nos inativos por engano. Suba uma planilha simples: <b>Código do cliente</b>, <b>Vendedor</b> (número, ou "número-nome"). O cliente é movido pra carteira certa não importa onde esteja hoje (outra carteira, duplicado, ou inativos) — se estiver duplicado, mantém só uma cópia. Ninguém é apagado.</p>
      <div class="form-row" style="align-items:center;">
        <input type="file" id="f_reatribuicao" accept=".xlsx,.xls">
        <button class="ghost-btn" id="btnProcessarReatribuicao">Processar correção</button>
      </div>
      <div id="msgReatribuicao"></div>
    </div>
  `;

  document.getElementById('btnEsvaziarAntesImport').onclick = async () => {
    const msg = document.getElementById('msgImport');
    const vendedorCodigo = Number(document.getElementById('f_vendedor_import').value);
    const v = STATE.vendors.find(v=>v.codigo===vendedorCodigo);
    const numClientes = clientsForVendor(vendedorCodigo).length;
    if(numClientes === 0){
      msg.innerHTML = `<div class="msg ok">${v.nome} já está sem clientes na carteira.</div>`;
      return;
    }
    const confirmou = await confirmarAcao(`Isso vai mover TODOS os ${numClientes} cliente(s) de ${v.nome} pra fila de "Clientes inativos" antes de importar a lista nova. Ninguém é apagado — só desvinculado. Continuar?`);
    if(!confirmou) return;
    const resultado = await esvaziarCarteiraDoVendedor(vendedorCodigo);
    msg.innerHTML = `<div class="msg ok">${resultado.movidos} cliente(s) de ${v.nome} foram movidos pra "Clientes inativos". Agora é só colar a lista nova abaixo e importar.</div>`;
  };

  document.getElementById('btnImport').onclick = async () => {
    const raw = document.getElementById('importArea').value;
    const msg = document.getElementById('msgImport');
    const vendedorCodigo = Number(document.getElementById('f_vendedor_import').value);
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ msg.innerHTML = `<div class="msg err">Cole ao menos uma linha.</div>`; return; }
    let existentes = clientsForVendor(vendedorCodigo).length;
    let count = 0;
    lines.forEach((line, idx) => {
      const parts = line.split('\t').map(p=>p.trim());
      if(!parts[0]) return;
      STATE.roster.push({
        id: 'c'+Date.now()+idx,
        codigo: Date.now()+idx,
        nome: parts[0] || 'Sem nome',
        telefone: parts[1] || '',
        contato: parts[2] || '',
        municipio: parts[3] || '',
        uf: parts[4] || '',
        vendedorCodigo,
        diaSemana: ((existentes+count) % 5) + 1,
      });
      count++;
    });
    await safeSet('crm:roster', STATE.roster);
    msg.innerHTML = `<div class="msg ok">${count} cliente(s) importado(s).</div>`;
    document.getElementById('importArea').value = '';
  };

  let PENDING_IMPORT_LOCAL = null;
  document.getElementById('btnProcessarBase').onclick = async () => {
    const msg = document.getElementById('msgBaseCompleta');
    const file = document.getElementById('f_base_completa').files[0];
    const modoSincronizacao = document.getElementById('f_modo_sincronizacao').checked;
    if(!file){ msg.innerHTML = `<div class="msg err">Escolha o arquivo .xlsx primeiro.</div>`; return; }
    msg.innerHTML = `<div class="hint">Lendo planilha...</div>`;
    try{
      const linhas = await lerPlanilhaClientes(file);
      const resultado = await processarImportacaoBase(linhas, modoSincronizacao);
      PENDING_IMPORT_LOCAL = resultado;
      const r = resultado.resumo;
      msg.innerHTML = `
        <div class="msg ok">
          Planilha lida: ${r.total} linha(s). Modo: <b>${modoSincronizacao ? 'Sincronizar exatamente' : 'Só adicionar (seguro)'}</b><br>
          ${r.atualizadosCarteira} cliente(s) já em carteiras foram atualizados (limite, saldo, telefone etc — histórico preservado).<br>
          ${r.novosNaCarteira} cliente(s) novo(s) entram <b>direto na carteira do vendedor</b> indicado na planilha.<br>
          ${r.atualizadosInativos} cliente(s) na fila de inativos foram atualizados.<br>
          ${r.novosInativos} cliente(s) novo(s) (sem vendedor cadastrado no CRM) vão entrar na fila de inativos.<br>
          ${modoSincronizacao ? `${r.reatribuidos} cliente(s) tiveram o <b>vendedor corrigido</b> (estava errado).<br>${r.removidosDaCarteira} cliente(s) <b>saem da carteira</b> (não apareceram mais na planilha pra esse vendedor) e voltam pra "Clientes inativos".<br>` : ''}
          ${r.ignorados} linha(s) ignorada(s) (sem CNPJ, sem compra, ou dado incompleto).
        </div>
        <button class="primary-btn" id="btnConfirmarImportBase" style="margin-top:10px;">Confirmar e salvar</button>
      `;
      document.getElementById('btnConfirmarImportBase').onclick = async () => {
        if(!PENDING_IMPORT_LOCAL) return;
        document.getElementById('btnConfirmarImportBase').textContent = 'Salvando...';
        await PENDING_IMPORT_LOCAL.aplicar();
        PENDING_IMPORT_LOCAL = null;
        STATE.config.ultimaAtualizacaoBaseMes = currentMonthKey();
        STATE.config.ultimaAtualizacaoBaseData = new Date().toISOString();
        await safeSet('crm:config', STATE.config);
        msg.innerHTML = `<div class="msg ok">Base atualizada com sucesso. Nada foi apagado.</div>`;
        document.getElementById('f_base_completa').value = '';
      };
    }catch(err){
      msg.innerHTML = `<div class="msg err">${err.message}</div>`;
    }
  };

  let PENDING_INADIMPLENCIA_LOCAL = null;
  document.getElementById('btnProcessarInadimplencia').onclick = async () => {
    const msg = document.getElementById('msgInadimplenciaImport');
    const file = document.getElementById('f_inadimplencia').files[0];
    if(!file){ msg.innerHTML = `<div class="msg err">Escolha o arquivo .xlsx primeiro.</div>`; return; }
    msg.innerHTML = `<div class="hint">Lendo planilha...</div>`;
    try{
      const linhas = await lerPlanilhaInadimplencia(file);
      const resultado = await processarListaInadimplencia(linhas);
      PENDING_INADIMPLENCIA_LOCAL = resultado;
      const r = resultado.resumo;
      msg.innerHTML = `
        <div class="msg ok">
          Planilha lida: ${r.total} linha(s).<br>
          ${r.marcados} cliente(s) serão marcados como inadimplentes.<br>
          ${r.novosClientesCriados > 0 ? `${r.novosClientesCriados} desses são clientes novos (ou que estavam na fila de inativos), que serão criados/movidos e atrelados automaticamente ao vendedor indicado na planilha${r.movidosDeInativos > 0 ? ` (${r.movidosDeInativos} deles saem da fila de "Clientes inativos")` : ''}.<br>` : ''}
          ${r.desmarcados} cliente(s) que estavam marcados vão voltar a "em dia" (não apareceram nessa lista).<br>
          ${r.semVendedorQtd} cliente(s) com vendedor não cadastrado no sistema — entram só no total geral (${fmtMoney(r.semVendedorTotal)}), sem carteira.<br>
          ${r.ignorados} linha(s) ignorada(s) (sem número de cliente).
        </div>
        <button class="primary-btn" id="btnConfirmarInadimplencia" style="margin-top:10px;">Confirmar e salvar</button>
      `;
      document.getElementById('btnConfirmarInadimplencia').onclick = async () => {
        if(!PENDING_INADIMPLENCIA_LOCAL) return;
        document.getElementById('btnConfirmarInadimplencia').textContent = 'Salvando...';
        await PENDING_INADIMPLENCIA_LOCAL.aplicar();
        PENDING_INADIMPLENCIA_LOCAL = null;
        STATE.config.ultimaAtualizacaoBaseData = new Date().toISOString();
        await safeSet('crm:config', STATE.config);
        msg.innerHTML = `<div class="msg ok">Lista de inadimplência atualizada com sucesso.</div>`;
        document.getElementById('f_inadimplencia').value = '';
      };
    }catch(err){
      msg.innerHTML = `<div class="msg err">${err.message}</div>`;
    }
  };

  document.getElementById('btnProcessarCatalogo').onclick = async () => {
    const msg = document.getElementById('msgCatalogoSkus');
    const file = document.getElementById('f_catalogo_skus').files[0];
    if(!file){ msg.innerHTML = `<div class="msg err">Escolha o arquivo .xlsx primeiro.</div>`; return; }
    msg.innerHTML = `<div class="hint">Lendo catálogo...</div>`;
    try{
      const catalogo = await lerPlanilhaCatalogoSkus(file);
      STATE.catalogoSkus = catalogo;
      await safeSet('crm:catalogo_skus', catalogo);
      msg.innerHTML = `<div class="msg ok">Catálogo atualizado: ${catalogo.length} SKU(s). Já vale pro botão "Baixar SKUs não vendidos" de todos os vendedores.</div>`;
      document.getElementById('f_catalogo_skus').value = '';
    }catch(err){
      msg.innerHTML = `<div class="msg err">${err.message}</div>`;
    }
  };

  let PENDING_REATRIBUICAO = null;
  document.getElementById('btnProcessarReatribuicao').onclick = async () => {
    const msg = document.getElementById('msgReatribuicao');
    const file = document.getElementById('f_reatribuicao').files[0];
    if(!file){ msg.innerHTML = `<div class="msg err">Escolha o arquivo .xlsx primeiro.</div>`; return; }
    msg.innerHTML = `<div class="hint">Lendo planilha...</div>`;
    try{
      const linhas = await lerPlanilhaReatribuicao(file);
      const resultado = await processarReatribuicao(linhas);
      PENDING_REATRIBUICAO = resultado;
      const r = resultado.resumo;
      msg.innerHTML = `
        <div class="msg ok">
          Planilha lida: ${r.total} linha(s).<br>
          ${r.movidos} cliente(s) serão movidos pro vendedor certo.<br>
          ${r.jaEstavamCertos} cliente(s) já estavam na carteira certa (nada muda).<br>
          ${r.duplicatasRemovidas} cópia(s) duplicada(s) serão removidas.<br>
          ${r.vendedorInvalido} linha(s) com vendedor não reconhecido.<br>
          ${r.naoEncontrados} código(s) não encontrado(s) em lugar nenhum.<br>
          ${r.ignorados} linha(s) ignorada(s) (sem código).
        </div>
        <button class="primary-btn" id="btnConfirmarReatribuicao" style="margin-top:10px;">Confirmar e salvar</button>
      `;
      document.getElementById('btnConfirmarReatribuicao').onclick = async () => {
        if(!PENDING_REATRIBUICAO) return;
        document.getElementById('btnConfirmarReatribuicao').textContent = 'Salvando...';
        await PENDING_REATRIBUICAO.aplicar();
        PENDING_REATRIBUICAO = null;
        msg.innerHTML = `<div class="msg ok">Correção aplicada com sucesso.</div>`;
        document.getElementById('f_reatribuicao').value = '';
      };
    }catch(err){
      msg.innerHTML = `<div class="msg err">${err.message}</div>`;
    }
  };
}

// ---------------- INIT ----------------
(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
</html>
