<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TF Imports — Carteira de Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF1EC;
    --surface:#FFFFFF;
    --ink:#1C2620;
    --ink-soft:#5B665F;
    --ink-faint:#8B9590;
    --primary:#C4291B;
    --primary-soft:#FBE6E2;
    --accent:#E8791F;
    --accent-soft:#FCEBDA;
    --danger:#9E3327;
    --danger-soft:#F4E1DD;
    --warn:#C98A1D;
    --warn-soft:#F7EAD3;
    --ok:#3E7A52;
    --ok-soft:#E2EEE4;
    --border:#D8DED4;
    --radius:14px;
    --shadow-soft:0 1px 2px rgba(28,38,32,.05), 0 4px 12px rgba(28,38,32,.05);
    --shadow-hover:0 2px 4px rgba(28,38,32,.07), 0 8px 20px rgba(28,38,32,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Space Grotesk', 'Inter', sans-serif;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%; max-width:400px; background:var(--surface);
    border:1px solid var(--border); border-radius:18px; padding:40px 36px; box-shadow:var(--shadow-hover);
  }
  .login-mark{
    width:60px; height:60px; border-radius:50%; margin-bottom:22px; overflow:hidden; box-shadow:var(--shadow-soft);
  }
  .login-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .login-card h1{font-family:'Space Grotesk'; font-size:26px; font-weight:600; margin-bottom:7px; letter-spacing:-0.3px;}
  .login-card p.sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:26px; line-height:1.5;}
  .field-label{font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .login-input{
    width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px; font-size:14.5px;
    font-family:'Inter'; margin-bottom:16px;
  }
  .login-input:focus{outline:none; border-color:var(--primary);}
  .login-submit{
    width:100%; padding:12px 14px; border:1px solid var(--primary); background:var(--primary);
    color:#fff; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .login-submit:hover{background:#96190F;}
  .login-error{background:var(--danger-soft); color:var(--danger); font-size:12.5px; padding:9px 12px; border-radius:7px; margin-bottom:14px;}

  /* ---------- SHELL ---------- */
  .shell{display:flex; flex:1; min-height:100vh;}
  .sidebar{
    width:238px; flex-shrink:0; background:var(--primary); color:#fff;
    display:flex; flex-direction:column; padding:24px 18px;
  }
  .sidebar .brand{display:flex; align-items:center; gap:11px; margin-bottom:30px; padding:0 6px;}
  .sidebar .brand .mark{width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .sidebar .brand .mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .sidebar .brand .name{font-family:'Space Grotesk'; font-weight:600; font-size:17px;}
  .sidebar nav{display:flex; flex-direction:column; gap:3px;}
  .nav-item{
    padding:11px 13px; border-radius:9px; cursor:pointer; font-size:14.5px; font-weight:500;
    color:rgba(255,255,255,.75); display:flex; align-items:center; gap:9px; transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.16); color:#fff;}
  .sidebar-footer{margin-top:auto; padding-top:18px; border-top:1px solid rgba(255,255,255,.15);}
  .whoami-row{display:flex; align-items:center; gap:11px; margin-bottom:12px;}
  .whoami-avatar{width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0; border:2px solid rgba(255,255,255,.3); box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .whoami-avatar-fallback{display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.15); color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
  .whoami{font-size:12.5px; color:rgba(255,255,255,.65); margin-bottom:0; line-height:1.4;}
  .whoami b{color:#fff; display:block; font-size:14.5px; font-weight:600;}
  .logout-btn{
    background:none; border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.8);
    font-size:12.5px; padding:8px 11px; border-radius:8px; cursor:pointer; width:100%;
  }
  .logout-btn:hover{background:rgba(255,255,255,.1);}

  .main{flex:1; padding:32px 40px; overflow-y:auto; max-width:1140px;}
  .page-header{margin-bottom:24px;}
  .page-header .eyebrow{font-size:13.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .page-header h2{font-family:'Space Grotesk'; font-size:29px; font-weight:600; letter-spacing:-0.3px;}

  /* ---------- PROGRESS ---------- */
  .progress-row{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:16px; margin-bottom:26px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; min-width:0; overflow:hidden; box-shadow:var(--shadow-soft);
    transition:box-shadow .18s, transform .18s;
  }
  .stat-card:hover{box-shadow:var(--shadow-hover); transform:translateY(-1px);}
  .stat-card .num{font-family:'Space Grotesk'; font-size:28px; font-weight:600; line-height:1.15; word-break:break-word;}
  .stat-card .label{font-size:13.5px; color:var(--ink-soft); margin-top:7px; font-weight:500;}
  .stat-card.accent .num{color:var(--accent);}
  .stat-card.danger .num{color:var(--danger);}
  .stat-card.ok .num{color:var(--ok);}

  .progress-bar-track{height:8px; background:var(--border); border-radius:20px; overflow:hidden; margin-top:10px;}
  .progress-bar-fill{height:100%; background:var(--ok); border-radius:20px; transition:width .3s;}

  /* ---------- CLIENT LIST ---------- */
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .search-input{
    flex:1; min-width:200px; padding:11px 15px; border:1px solid var(--border); border-radius:10px;
    font-size:14.5px; font-family:'Inter'; background:var(--surface);
  }
  .search-input:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft);}
  select.filter-select{
    padding:11px 13px; border:1px solid var(--border); border-radius:10px; font-size:14.5px;
    background:var(--surface); font-family:'Inter'; color:var(--ink);
  }
  .client-list{display:flex; flex-direction:column; gap:9px;}
  .client-row{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border);
    border-radius:11px; padding:15px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    box-shadow:var(--shadow-soft); transition:box-shadow .18s;
  }
  .client-row:hover{box-shadow:var(--shadow-hover);}
  .client-row.status-ok{border-left-color:var(--ok);}
  .client-row.status-warn{border-left-color:var(--warn);}
  .client-row.status-danger{border-left-color:var(--danger);}
  .client-row.comprou-mes{background:var(--ok-soft);}
  .comprou-mes-linha{font-size:13px; color:var(--ok); font-weight:700; margin-top:3px;}
  .meta-cliente-linha{margin-top:4px;}
  .meta-cliente-editar{font-size:13px; color:var(--ink-soft); cursor:pointer; padding:3px 7px; border-radius:6px; border:1px dashed var(--border);}
  .meta-cliente-editar:hover{border-color:var(--primary); color:var(--primary);}
  .meta-cliente-editar b{color:var(--ink);}
  .meta-resultado{font-size:27px; font-weight:800; line-height:1; flex-shrink:0; width:34px; text-align:center;}
  .meta-resultado.meta-ok{color:var(--ok);}
  .meta-resultado.meta-fail{color:var(--danger);}
  .inadimplente-linha{font-size:12.5px; color:#111; font-weight:700; margin-top:3px;}
  .inadimplente-editar{font-size:12px; color:var(--ink-soft); cursor:pointer; padding:2px 6px; border-radius:6px; border:1px dashed var(--border);}
  .inadimplente-editar:hover{border-color:#000; color:#000;}
  /* Cliente inadimplente: pintado de preto por cima de qualquer outra cor (inclusive comprou-mes). */
  .client-row.inadimplente{background:#161616; border-left-color:#000;}
  .client-row.inadimplente .client-name,
  .client-row.inadimplente .client-num,
  .client-row.inadimplente .client-meta,
  .client-row.inadimplente .client-meta a,
  .client-row.inadimplente .credito-line,
  .client-row.inadimplente .credito-line b,
  .client-row.inadimplente .meta-cliente-editar,
  .client-row.inadimplente .comprou-mes-linha,
  .client-row.inadimplente .inadimplente-linha,
  .client-row.inadimplente .inadimplente-editar,
  .client-row.inadimplente .day-pill{ color:#f2f2f2; }
  .client-row.inadimplente .client-meta a{ color:#d8d8d8; }
  .client-row.inadimplente .day-pill{ border-color:#555; }
  .client-row.inadimplente .inadimplente-editar{ border-color:#555; }
  .client-row.inadimplente .inadimplente-editar:hover{ border-color:#fff; color:#fff; }
  .client-row.inadimplente .status-badge{ background:#333; color:#f2f2f2; }
  .client-info{flex:1; min-width:180px;}
  .client-name{font-size:15.5px; font-weight:600; color:var(--ink); margin-bottom:3px;}
  .client-num{font-size:11px; font-weight:600; color:var(--ink-faint); vertical-align:middle;}
  .client-name-link{cursor:pointer;}
  .client-name-link:hover{color:var(--primary); text-decoration:underline;}
  .client-name-link:hover .client-num{color:var(--primary);}
  .client-meta{font-size:13.5px; color:var(--ink-soft); display:flex; gap:10px; flex-wrap:wrap;}
  .client-meta a{color:var(--ink-soft); text-decoration:none;}
  .client-meta a:hover{color:var(--primary); text-decoration:underline;}
  .credito-line{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); margin-top:5px; padding-top:5px; border-top:1px dashed var(--border);}
  .credito-line b{color:var(--ink); font-weight:600;}
  .credito-line .credito-zerado b{color:var(--danger);}
  .credito-line.credito-vazio{color:var(--ink-faint); font-style:italic;}
  .status-badge{
    font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .status-badge.status-ok{background:var(--ok-soft); color:var(--ok);}
  .status-badge.status-warn{background:var(--warn-soft); color:var(--warn);}
  .status-badge.status-danger{background:var(--danger-soft); color:var(--danger);}
  .check-btn{
    padding:10px 16px; border-radius:9px; border:1px solid var(--primary); background:var(--primary);
    color:#fff; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap; flex-shrink:0;
    transition:transform .15s, box-shadow .15s;
  }
  .check-btn:hover{background:#96190F; box-shadow:var(--shadow-soft); transform:translateY(-1px);}
  .check-btn.done{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
  .day-pill{font-size:11.5px; font-weight:600; color:var(--ink-faint); border:1px solid var(--border); padding:4px 9px; border-radius:20px; flex-shrink:0;}
  .agenda-pill{font-size:11.5px; font-weight:600; color:var(--accent); border:1px solid var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:20px; flex-shrink:0; cursor:pointer;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:14.5px;
    background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius);
  }

  /* ---------- TABS ---------- */
  .tabs{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--border);}
  .tab-btn{
    padding:10px 4px; margin-right:20px; background:none; border:none; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; position:relative; top:1px;
  }
  .tab-btn.active{color:var(--primary); border-bottom-color:var(--primary);}

  /* ---------- MANAGER VENDOR CARDS ---------- */
  .vendor-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; margin-bottom:28px;}
  .vendor-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; cursor:pointer; transition:border-color .15s;}
  .vendor-card:hover{border-color:var(--primary);}
  .vendor-card .vname{font-weight:600; font-size:14.5px; margin-bottom:10px;}
  .vendor-card .vstats{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-top:8px;}
  .vendor-card .vstats b{color:var(--ink); font-size:13px;}

  /* ---------- FORMS / MODAL ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; margin-bottom:22px; box-shadow:var(--shadow-soft);}
  .panel h3{font-family:'Space Grotesk'; font-size:18px; font-weight:600; margin-bottom:5px;}
  .panel .hint{font-size:13.5px; color:var(--ink-soft); margin-bottom:15px; line-height:1.6;}
  .admin-section-title{
    font-family:'Space Grotesk'; font-size:13px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.6px; color:var(--ink-soft); margin:32px 0 14px; padding-top:22px;
    border-top:2px solid var(--border);
  }
  .admin-section-title:first-of-type{margin-top:0; padding-top:0; border-top:none;}
  .import-panel{border-left-width:5px; border-left-style:solid;}
  .import-panel-title{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .import-panel-title h3{margin-bottom:0;}
  .import-badge{
    width:26px; height:26px; border-radius:50%; color:#fff; font-family:'Space Grotesk'; font-weight:700;
    font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .form-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
  .form-row input, .form-row select{
    flex:1; min-width:140px; padding:9px 12px; border:1px solid var(--border); border-radius:7px; font-size:13.5px; font-family:'Inter';
  }
  textarea.import-area{
    width:100%; min-height:110px; border:1px solid var(--border); border-radius:9px; padding:11px 13px;
    font-family:'Inter'; font-size:14px; margin-bottom:10px; resize:vertical;
  }
  .primary-btn{padding:11px 20px; border-radius:9px; border:1px solid var(--primary); background:var(--primary); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; transition:transform .15s, box-shadow .15s;}
  .primary-btn:hover{background:#96190F; box-shadow:var(--shadow-soft); transform:translateY(-1px);}
  .ghost-btn{padding:10px 15px; border-radius:9px; border:1px solid var(--border); background:none; color:var(--ink); font-size:14px; font-weight:500; cursor:pointer; transition:border-color .15s, color .15s;}
  .ghost-btn:hover{border-color:var(--primary); color:var(--primary);}
  .msg{font-size:13.5px; margin-top:8px; padding:9px 12px; border-radius:8px;}
  .msg.ok{background:var(--ok-soft); color:var(--ok);}
  .msg.err{background:var(--danger-soft); color:var(--danger);}

  .cred-table{width:100%; border-collapse:collapse; font-size:13px;}
  .cred-table th{text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border);}
  .cred-table td{padding:8px; border-bottom:1px solid var(--border);}
  .cred-table input{padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:12.5px; width:100%;}
  .pin{font-family:'Space Grotesk'; font-weight:600; letter-spacing:1px;}

  .toggle-row{display:flex; gap:8px;}
  .toggle-btn{
    flex:1; padding:10px 12px; border:1px solid var(--border); background:var(--surface);
    border-radius:7px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .toggle-btn.active[data-val="nao"]{border-color:var(--ink-soft); color:var(--ink); background:var(--bg);}
  .toggle-btn.active[data-val="sim"]{border-color:var(--ok); color:var(--ok); background:var(--ok-soft);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(20,25,22,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:var(--surface); border-radius:16px; padding:26px; width:100%; max-width:390px; box-shadow:var(--shadow-hover);}
  .modal h3{font-family:'Space Grotesk'; font-size:18px; margin-bottom:15px;}
  .modal textarea{width:100%; min-height:70px; border:1px solid var(--border); border-radius:9px; padding:11px; font-family:'Inter'; font-size:14px; margin-bottom:14px;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}

  .loading{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--ink-soft); font-size:14.5px;}

  @media (max-width: 760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; padding:14px 16px; overflow-x:auto;}
    .sidebar .brand{margin-bottom:0;}
    .sidebar nav{flex-direction:row;}
    .sidebar-footer{display:none;}
    .main{padding:20px 16px;}
    .client-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando carteira…</div></div>

<script>

  vendors: null,
  roster: null,
  config: null,
  grupos: null, // grupos de CNPJ vinculados: [{id, membros:[codigo,...]}]
  leads: null, // leads dos vendedores: separados da base de clientes, nunca apagados por importação
  diretores: null, // contas de diretor/dono: mesmo acesso do gerente
  catalogoSkus: null, // catálogo de produtos (código, descrição, estoque) subido pelo gerente
  mesSelecionado: null, // 'YYYY-MM' — mês sendo visualizado no dashboard/análises

  session: null, // {tipo:'gerente'} or {tipo:'vendedor', codigo, nome}

};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Primeiro dia útil (não sábado/domingo) do mês atual, formato YYYY-MM-DD.
function primeiroDiaUtilStr(){
  const hoje = new Date();
  let d = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()+1); }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// A partir do primeiro dia útil do mês, o sistema fica bloqueado pra todo mundo até o gerente atualizar a base.
function baseDesatualizadaBloqueando(){
  if(!STATE.config) return false;
  const primeiroUtil = primeiroDiaUtilStr();
  const jaAtualizouEsteMes = STATE.config.ultimaAtualizacaoBaseMes === currentMonthKey();
  return todayStr() >= primeiroUtil && !jaAtualizouEsteMes;
}

function daysBetween(dateStr){
  if(!dateStr) return Infinity;
  const a = new Date(dateStr+'T00:00:00');
  const b = new Date(todayStr()+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function statusFor(dateStr){
  const d = daysBetween(dateStr);
  if(d === Infinity) return 'danger';
  if(d > 30) return 'danger';
  if(d >= 20) return 'warn';
  return 'ok';
}
function statusLabel(dateStr){
  const d = daysBetween(dateStr);
  if(d === Infinity) return 'Nunca contatado';
  if(d === 0) return 'Contatado hoje';
  if(d === 1) return 'Há 1 dia';
  return 'Há '+d+' dias';
}
// Wraps statusFor/statusLabel to account for a future callback schedule (agendadoPara),
// which pauses the client's overdue clock until that date arrives.
function clientStatus(reg){
  const ag = reg?.agendadoPara;
  if(ag && ag > todayStr()) return 'scheduled';
  return statusFor(reg?.ultimoContato);
}
function clientStatusLabel(reg){
  const ag = reg?.agendadoPara;
  if(ag && ag > todayStr()) return 'Agendado p/ '+fmtDatePt(ag);
  return statusLabel(reg?.ultimoContato);
}
function todayWeekday(){
  const jsDay = new Date().getDay();
  if(jsDay===0 || jsDay===6) return 0;
  return jsDay;
}
function fmtDatePt(dateStr){
  if(!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  return d+'/'+m+'/'+y;
}
function fmtDataHora(isoStr){
  if(!isoStr) return '—';
  const d = new Date(isoStr);
  if(isNaN(d)) return '—';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} às ${hh}:${min}`;
}

// Confirmação e aviso próprios do sistema — não dependemos de confirm()/alert() do navegador,
// que às vezes não funcionam dentro do painel de artefatos do Claude.
function confirmarAcao(mensagem){
  return new Promise((resolve) => {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" style="max-width:380px;">
        <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${mensagem}</p>

async function safeGet(key, shared=true){

  const idx = pool.findIndex(c => c.codigo === codigoCliente);

// Esvazia a carteira de um vendedor: todos os clientes dele voltam pra fila de "Clientes inativos"
// (não são apagados, só desvinculados), liberando espaço pra subir uma base nova só pra ele.
// Histórico de contatos/vendas passados fica guardado (não é apagado), só fica sem uso enquanto
// o cliente não estiver na carteira de ninguém.
async function esvaziarCarteiraDoVendedor(vendedorCodigo){
  const meusClientes = clientsForVendor(vendedorCodigo);
  if(meusClientes.length === 0) return {movidos: 0};
  const pool = await getInativos();
  meusClientes.forEach(c => {
    pool.push({
      codigo: c.codigo,
      nome: c.nome,
      municipio: c.municipio || '',
      uf: c.uf || '',
      cnpj: c.cnpj || '',

      contato: c.contato || '',
      ultimaCompra: null,
      limiteCredito: c.limiteCredito,
      saldoDevedor: c.saldoDevedor,

  });

  STATE.roster = STATE.roster.filter(c => c.vendedorCodigo !== vendedorCodigo);
  await safeSet('crm:roster', STATE.roster);

// Lê a planilha de reatribuição: Código do cliente, Vendedor (código ou "código-nome").
function lerPlanilhaReatribuicao(file){

// Força a realocação de clientes específicos pro vendedor certo, não importa onde estejam hoje
// (em outra carteira ou na fila de inativos). Útil pra corrigir duplicações ou atribuições erradas.
// Nunca apaga o cliente — só move. Se achar o mesmo código MAIS DE UMA VEZ na carteira de algum
// vendedor (duplicata), mantém só uma cópia e remove as duplicatas extras.
async function processarReatribuicao(linhas){
  const vendedoresByCodigo = new Map(STATE.vendors.map(v=>[v.codigo, v]));
  const poolInativos = await getInativos();
  const inativosByCodigo = new Map(poolInativos.map(c=>[c.codigo, c]));

  let movidos = 0, jaEstavamCertos = 0, duplicatasRemovidas = 0, naoEncontrados = 0, vendedorInvalido = 0, ignorados = 0;
  const acoes = [];

  const codigosProcessados = new Set();
  linhas.forEach(row => {
    const [codigoRaw, vendedorTexto] = row;
    const codigo = Number(codigoRaw);
    if(!codigo || codigosProcessados.has(codigo)){ if(!codigo) ignorados++; return; }
    codigosProcessados.add(codigo);
    const codigoVendedor = extrairCodigoVendedorTexto(vendedorTexto) ?? (Number(vendedorTexto) || null);
    const vendedor = codigoVendedor !== null ? vendedoresByCodigo.get(codigoVendedor) : null;
    if(!vendedor){ vendedorInvalido++; return; }

    const ocorrenciasRoster = STATE.roster.filter(c => c.codigo === codigo);
    const noInativos = inativosByCodigo.get(codigo);

    if(ocorrenciasRoster.length === 0 && !noInativos){
      naoEncontrados++;
      return;
    }
    // Calcula agora (preview) o que vai acontecer, pra mostrar no resumo antes de confirmar.
    if(ocorrenciasRoster.length > 0){
      if(ocorrenciasRoster[0].vendedorCodigo !== vendedor.codigo) movidos++;
      else jaEstavamCertos++;
      if(ocorrenciasRoster.length > 1) duplicatasRemovidas += ocorrenciasRoster.length - 1;
    } else {
      movidos++;
    }
    acoes.push({codigo, vendedorDestino: vendedor.codigo, ocorrenciasRoster, noInativos});
  });

  return {
    aplicar: async () => {
      acoes.forEach(a => {
        if(a.ocorrenciasRoster.length > 0){
          a.ocorrenciasRoster[0].vendedorCodigo = a.vendedorDestino;
        }
      });
      // Remove duplicatas do roster (mantendo só a primeira ocorrência de cada código tratado).
      const vistos = new Set();
      STATE.roster = STATE.roster.filter(c => {
        const acao = acoes.find(a => a.codigo === c.codigo);
        if(!acao || acao.ocorrenciasRoster.length === 0) return true;
        if(vistos.has(c.codigo)) return false;
        vistos.add(c.codigo);
        return true;
      });
      // Move quem estava só nos inativos pra carteira do vendedor certo.
      const codigosDosInativosMovidos = new Set();
      acoes.forEach(a => {
        if(a.ocorrenciasRoster.length === 0 && a.noInativos){
          const cliente = a.noInativos;
          const existentes = clientsForVendor(a.vendedorDestino).length;
          STATE.roster.push({
            id: 'c'+a.vendedorDestino+'-'+cliente.codigo,
            codigo: cliente.codigo, nome: cliente.nome,
            municipio: cliente.municipio||'', uf: cliente.uf||'', cnpj: cliente.cnpj||'',
            telefone: cliente.telefone||'', contato: cliente.contato||'',
            vendedorCodigo: a.vendedorDestino,
            diaSemana: (existentes % 5) + 1,
            limiteCredito: cliente.limiteCredito, saldoDevedor: cliente.saldoDevedor,
          });
          codigosDosInativosMovidos.add(cliente.codigo);
        }
      });
      const novoPoolInativos = poolInativos.filter(c => !codigosDosInativosMovidos.has(c.codigo));
      await safeSet('crm:roster', STATE.roster);
      await safeSet('crm:inativos', novoPoolInativos);
    },
    resumo: {movidos, jaEstavamCertos, duplicatasRemovidas, naoEncontrados, vendedorInvalido, ignorados, total: linhas.length},
  };
}

function formatarDataExcel(v){
  if(!v && v !== 0) return null;
  if(v instanceof Date && !isNaN(v)){
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  }
  if(typeof v === 'number' && v > 0){
    const epoch = new Date(Date.UTC(1899,11,30));
    const d = new Date(epoch.getTime() + v*86400000);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  return null;
}

// Normaliza texto de cabeçalho pra comparar sem se importar com acento, maiúscula ou espaço extra.
function normalizarCabecalho(txt){
  return String(txt||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .replace(/[^a-z0-9]/g, ''); // tira espaço, hífen, etc.
}

// Mapa de nomes possíveis de cabeçalho (já normalizados) pra cada campo que o sistema usa.
const MAPA_CABECALHOS_CLIENTES = {
  status: ['status'],
  codigo: ['codigo'],
  dataCad: ['datacadastro', 'datacad'],
  nome: ['nome'],
  ultimaCompra: ['ultimacompra'],
  municipio: ['municipio'],
  uf: ['uf'],
  cnpj: ['cnpj'],
  ie: ['inscricaoestadual'],
  vendedor: ['vendedor'],
  ddd: ['ddd'],
  telefone: ['telefone'],
  contato: ['contato'],
  limite: ['limitecredito'],
  saldoDevedor: ['saldodevedor'],
  saldoCredito: ['saldodecredito', 'saldocredito'],
  primeiraCompra: ['primeiracompra'],
  cpf: ['cpf'],
  maiorCompra: ['maiorcompra'],
};

// Lê o arquivo .xlsx no navegador e devolve as linhas já reorganizadas na ordem fixa que o
// sistema usa: Status, Codigo, DataCad, Nome, UltimaCompra, Municipio, UF, CNPJ, IE, Vendedor,
// DDD, Telefone, Contato, Limite, SaldoDevedor, SaldoCredito, PrimeiraCompra, CPF, MaiorCompra.
// Não depende da ordem das colunas na planilha original (identifica pelo NOME do cabeçalho),
// então funciona tanto em exportações com coluna de E-mail quanto sem.
function lerPlanilhaClientes(file){
  return new Promise((resolve, reject) => {
    if(typeof XLSX === 'undefined'){ reject(new Error('Biblioteca de planilha não carregou. Tente recarregar a página.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
    reader.onload = () => {
      try{
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const todasLinhas = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
        const cabecalho = todasLinhas.shift() || [];
        const cabecalhoNormalizado = cabecalho.map(normalizarCabecalho);

        // Pra cada campo que precisamos, acha em qual coluna ele está nessa planilha específica.
        const indices = {};
        Object.keys(MAPA_CABECALHOS_CLIENTES).forEach(campo => {
          const aliases = MAPA_CABECALHOS_CLIENTES[campo];
          const idx = cabecalhoNormalizado.findIndex(h => aliases.includes(h));
          indices[campo] = idx; // -1 se não achou essa coluna nessa planilha
        });
        if(indices.codigo === -1 || indices.nome === -1){
          reject(new Error('Não encontrei as colunas "Código" e "Nome" nessa planilha. Confira se é o mesmo tipo de arquivo de sempre.'));
          return;
        }

        const ordemFixa = ['status','codigo','dataCad','nome','ultimaCompra','municipio','uf','cnpj','ie','vendedor','ddd','telefone','contato','limite','saldoDevedor','saldoCredito','primeiraCompra','cpf','maiorCompra'];
        const linhas = todasLinhas.map(row => ordemFixa.map(campo => {
          const idx = indices[campo];
          return idx === -1 ? null : row[idx];
        }));
        resolve(linhas);
      }catch(err){
        reject(new Error('Não consegui ler essa planilha. Confirme se é o mesmo tipo de arquivo de sempre.'));
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

// Processa as linhas: só ATUALIZA campos de quem já existe (nunca mexe em histórico/observações)
// e só ADICIONA gente nova na fila de inativos. Nada é apagado.
// modoSincronizacao=true: além de atualizar/adicionar, corrige o vendedor de quem está errado
// e MOVE pra inativos quem estava na carteira de algum vendedor mas não apareceu nessa planilha
// pra esse vendedor (nunca apaga o cliente — só desvincula). Use quando quiser que a carteira de
// cada vendedor fique EXATAMENTE igual ao que a planilha diz, sem sobras nem duplicatas.
async function processarImportacaoBase(linhas, modoSincronizacao){
  const inativosPool = await getInativos();
  const rosterByCodigo = new Map(STATE.roster.map(c=>[c.codigo, c]));
  const inativosByCodigo = new Map(inativosPool.map(c=>[c.codigo, c]));
  const vendedoresByCodigo = new Map(STATE.vendors.map(v=>[v.codigo, v]));

  let atualizadosCarteira = 0, atualizadosInativos = 0, novosInativos = 0, novosNaCarteira = 0, ignorados = 0, reatribuidos = 0;
  const novosParaAdicionar = [];
  const novosRoster = [];
  const codigosNaPlanilha = new Set();

  linhas.forEach(row => {
    const [status, codigo, dataCad, nome, ultimaCompraRaw, municipio, uf, cnpj, ie, vendedor, ddd, telefone, contato, limite, saldoDevedor, saldoCredito, primeiraCompra, cpf, maiorCompra] = row;
    if(!codigo || !nome){ ignorados++; return; }
    codigosNaPlanilha.add(codigo);
    const telefoneFmt = (ddd && telefone) ? `(${ddd}) ${telefone}` : (telefone ? String(telefone) : '');
    const ultimaCompra = formatarDataExcel(ultimaCompraRaw);
    const limiteNum = (limite !== null && limite !== undefined && limite !== '') ? Number(limite) : null;
    const saldoNum = (saldoDevedor !== null && saldoDevedor !== undefined && saldoDevedor !== '') ? Number(saldoDevedor) : null;
    const codigoVendedor = (vendedor !== null && vendedor !== undefined && vendedor !== '') ? Number(vendedor) : null;
    const vendedorCrm = codigoVendedor !== null ? vendedoresByCodigo.get(codigoVendedor) : null;

    if(rosterByCodigo.has(codigo)){
      const c = rosterByCodigo.get(codigo);
      if(nome) c.nome = nome;
      if(municipio) c.municipio = municipio;
      if(uf) c.uf = uf;
      if(telefoneFmt) c.telefone = telefoneFmt;
      if(contato) c.contato = contato;
      if(limiteNum !== null) c.limiteCredito = limiteNum;
      if(saldoNum !== null) c.saldoDevedor = saldoNum;
      if(modoSincronizacao && vendedorCrm && c.vendedorCodigo !== vendedorCrm.codigo){
        c.vendedorCodigo = vendedorCrm.codigo;
        reatribuidos++;
      }
      atualizadosCarteira++;
      return;
    }
    if(inativosByCodigo.has(codigo)){
      const c = inativosByCodigo.get(codigo);
      if(nome) c.nome = nome;
      if(municipio) c.municipio = municipio;
      if(uf) c.uf = uf;
      if(telefoneFmt) c.telefone = telefoneFmt;
      if(contato) c.contato = contato;
      if(cnpj) c.cnpj = String(cnpj);
      if(ultimaCompra) c.ultimaCompra = ultimaCompra;
      if(limiteNum !== null) c.limiteCredito = limiteNum;
      if(saldoNum !== null) c.saldoDevedor = saldoNum;
      atualizadosInativos++;
      return;
    }

    // Cliente totalmente novo: se o número de vendedor da planilha bater com um vendedor
    // cadastrado no CRM, entra direto na carteira dele. Senão, segue pra fila de inativos
    // (só se atender aos critérios de sempre: status ativo, CNPJ e já ter comprado).
    if(status === '0' && vendedorCrm){
      const existentesDoVendedor = clientsForVendor(vendedorCrm.codigo).length + novosRoster.filter(n=>n.vendedorCodigo===vendedorCrm.codigo).length;
      const novoCliente = {
        id: 'c'+vendedorCrm.codigo+'-'+codigo,
        codigo, nome, municipio: municipio||'', uf: uf||'',
        telefone: telefoneFmt, contato: contato||'', cnpj: cnpj ? String(cnpj) : '',
        vendedorCodigo: vendedorCrm.codigo,
        diaSemana: (existentesDoVendedor % 5) + 1,
        limiteCredito: limiteNum, saldoDevedor: saldoNum,
      };
      novosRoster.push(novoCliente);
      rosterByCodigo.set(codigo, novoCliente); // evita duplicar se a planilha repetir o código
      novosNaCarteira++;
      return;
    }
    if(status === '0' && cnpj && ultimaCompra){
      const novo = {
        codigo, nome, municipio: municipio||'', uf: uf||'', cnpj: String(cnpj),
        telefone: telefoneFmt, contato: contato||'', ultimaCompra,
        limiteCredito: limiteNum, saldoDevedor: saldoNum,
      };
      novosParaAdicionar.push(novo);
      inativosByCodigo.set(codigo, novo);
      novosInativos++;
    } else {
      ignorados++;
    }
  });

  // Modo sincronização: quem está numa carteira mas sumiu da planilha, sai (vai pra inativos).
  let removidosDaCarteira = 0;
  const paraRemoverDaCarteira = modoSincronizacao
    ? STATE.roster.filter(c => c.vendedorCodigo && !codigosNaPlanilha.has(c.codigo))
    : [];
  removidosDaCarteira = paraRemoverDaCarteira.length;

  return {
    aplicar: async () => {
      novosParaAdicionar.forEach(n => inativosPool.push(n));
      novosRoster.forEach(n => STATE.roster.push(n));
      if(paraRemoverDaCarteira.length > 0){
        const codigosRemover = new Set(paraRemoverDaCarteira.map(c=>c.codigo));
        paraRemoverDaCarteira.forEach(c => {
          inativosPool.push({
            codigo: c.codigo, nome: c.nome, municipio: c.municipio||'', uf: c.uf||'',
            cnpj: c.cnpj||'', telefone: c.telefone||'', contato: c.contato||'',
            ultimaCompra: null, limiteCredito: c.limiteCredito, saldoDevedor: c.saldoDevedor,
          });
        });
        STATE.roster = STATE.roster.filter(c => !codigosRemover.has(c.codigo));
      }
      await safeSet('crm:roster', STATE.roster);
      await safeSet('crm:inativos', inativosPool);
    },
    resumo: {atualizadosCarteira, atualizadosInativos, novosInativos, novosNaCarteira, ignorados, reatribuidos, removidosDaCarteira, total: linhas.length},
  };
}

// Lê uma planilha simples de inadimplência: Número do cliente, Data, Vendedor (informativo), Valor devido (opcional).
function lerPlanilhaInadimplencia(file){
  return new Promise((resolve, reject) => {
    if(typeof XLSX === 'undefined'){ reject(new Error('Biblioteca de planilha não carregou. Tente recarregar a página.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
    reader.onload = () => {
      try{
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const linhas = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
        linhas.shift(); // remove cabeçalho
        resolve(linhas);
      }catch(err){
        reject(new Error('Não consegui ler essa planilha. Confira se a primeira linha é o cabeçalho.'));
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

// Lê a planilha do catálogo de SKUs: Código, Descrição, Estoque (opcional). Substitui o catálogo inteiro.
function lerPlanilhaCatalogoSkus(file){
  return new Promise((resolve, reject) => {
    if(typeof XLSX === 'undefined'){ reject(new Error('Biblioteca de planilha não carregou. Tente recarregar a página.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
    reader.onload = () => {
      try{
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const linhas = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
        linhas.shift();
        const catalogo = linhas
          .filter(row => row[0])
          .map(row => ({
            codigo: String(row[0]).trim().toUpperCase(),
            descricao: row[1] || '',
            estoque: (row[2] !== null && row[2] !== undefined && row[2] !== '') ? Number(row[2]) : null,
          }));
        resolve(catalogo);
      }catch(err){
        reject(new Error('Não consegui ler essa planilha. Confira se a primeira linha é o cabeçalho.'));
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

// Gera e baixa uma planilha .xlsx direto no navegador (usa a mesma lib já carregada pro pedido em PDF).
function baixarXlsx(dados, nomeAba, nomeArquivo){
  if(typeof XLSX === 'undefined'){ avisar('Biblioteca de planilha não carregou. Tente recarregar a página.'); return; }
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nomeAba);
  XLSX.writeFile(wb, nomeArquivo);
}

    avisar('Nenhum SKU vendido registrado nesse mês ainda.');

  }
  const dados = s.skusVendidosDetalhe.map(item => ({
    'Código': item.codigo,

    'Quantidade vendida': item.quantidade,
  }));

}

function baixarPlanilhaSkusNaoVendidos(){
  const s = vendorMonthStats(STATE.session.codigo);
  const catalogo = STATE.catalogoSkus || [];
  if(catalogo.length === 0){
    avisar('Ainda não tem catálogo de SKUs cadastrado no sistema. Assim que o gerente subir a planilha de produtos, esse botão passa a funcionar.');
    return;
  }
  const vendidosSet = new Set((s.skusVendidosDetalhe||[]).map(i=>i.codigo));
  const naoVendidos = catalogo.filter(item => !vendidosSet.has(item.codigo));
  if(naoVendidos.length === 0){
    avisar('Você já vendeu todos os SKUs do catálogo esse mês. 🎉');
    return;
  }
  const dados = naoVendidos.map(item => ({
    'Código': item.codigo,
    'Descrição': item.descricao,
    'Estoque disponível': item.estoque !== null && item.estoque !== undefined ? item.estoque : '',
  }));
  baixarXlsx(dados, 'SKUs não vendidos', `skus_nao_vendidos_${STATE.session.nome}_${s.mesChave}.xlsx`);
}

// Extrai o código numérico do vendedor de um texto tipo "24-PAULO HENRIQUE MARTINS GOMES".
function extrairCodigoVendedorTexto(txt){
  const m = String(txt||'').trim().match(/^(\d+)/);
  return m ? Number(m[1]) : null;
}

// Processa a lista de inadimplentes. Formato esperado: Número do cliente, Nome, Data, Vendedor, Valor devido.
// - Cliente já existente numa carteira: só marca inadimplente (mantém o vendedor que o CRM já tinha).
// - Cliente que está na fila de "Clientes inativos": sai de lá e entra na carteira do vendedor indicado
//   na planilha (se esse vendedor existir no CRM), levando junto CNPJ/telefone/limite que já tinha.
// - Cliente que não existe em lugar nenhum: mesma coisa, só que criado do zero com o que a planilha trouxe.
// - Se o vendedor da planilha não existe no CRM, o cliente entra só no total "sem vendedor cadastrado"
//   e não é movido de lugar nenhum.
// - Quem estava inadimplente e não apareceu nessa lista atualizada: volta a ficar em dia.
async function processarListaInadimplencia(linhas){
  const rosterByCodigo = new Map(STATE.roster.map(c=>[c.codigo, c]));
  const vendedoresByCodigo = new Map(STATE.vendors.map(v=>[v.codigo, v]));
  const poolInativos = await getInativos();
  const inativosByCodigo = new Map(poolInativos.map(c=>[c.codigo, c]));
  const codigosNaLista = new Set();
  let marcados = 0, naoEncontrados = 0, ignorados = 0, novosClientesCriados = 0, movidosDeInativos = 0;
  const alteracoes = [];
  const novosRoster = [];
  const codigosParaRemoverDosInativos = new Set();
  let semVendedorQtd = 0, semVendedorTotal = 0;

  linhas.forEach(row => {
    const [codigoRaw, nomeRaw, dataRaw, vendedorTexto, valorRaw] = row;
    const codigo = Number(codigoRaw);
    if(!codigo){ ignorados++; return; }
    codigosNaLista.add(codigo);
    const data = formatarDataExcel(dataRaw) || todayStr();
    const valor = (valorRaw !== null && valorRaw !== undefined && valorRaw !== '') ? Number(valorRaw) : null;

    const existente = rosterByCodigo.get(codigo);
    if(existente){
      alteracoes.push({c: existente, novoStatus:true, data, valor});
      marcados++;
      return;
    }

    // Cliente não está em nenhuma carteira ainda — tenta atrelar pelo vendedor da planilha.
    // Se ele estiver parado na fila de inativos, aproveita os dados que já tem (CNPJ, telefone, limite)
    // e tira ele de lá.
    const codigoVendedor = extrairCodigoVendedorTexto(vendedorTexto);
    const vendedor = codigoVendedor !== null ? vendedoresByCodigo.get(codigoVendedor) : null;
    if(vendedor){
      const doInativo = inativosByCodigo.get(codigo);
      const existentesDoVendedor = clientsForVendor(vendedor.codigo).length + novosRoster.filter(n=>n.vendedorCodigo===vendedor.codigo).length;
      const novoCliente = {
        id: 'c'+vendedor.codigo+'-'+codigo,
        codigo,
        nome: (doInativo && doInativo.nome) || nomeRaw || ('Cliente Nº '+codigo),
        municipio: (doInativo && doInativo.municipio) || '',
        uf: (doInativo && doInativo.uf) || '',
        telefone: (doInativo && doInativo.telefone) || '',
        contato: (doInativo && doInativo.contato) || '',
        cnpj: (doInativo && doInativo.cnpj) || '',
        vendedorCodigo: vendedor.codigo,
        diaSemana: (existentesDoVendedor % 5) + 1,
        limiteCredito: doInativo ? doInativo.limiteCredito : null,
        saldoDevedor: doInativo ? doInativo.saldoDevedor : null,
        inadimplente: true, inadimplenteDesde: data, valorDevido: valor,
        inadimplenteObs: `Importado da lista de inadimplência (${fmtDatePt(data)})${doInativo ? ' — saiu da fila de inativos' : ' — cliente novo'}, atrelado pelo vendedor Nº ${vendedor.codigo} informado na planilha.`,
      };
      novosRoster.push(novoCliente);
      rosterByCodigo.set(codigo, novoCliente); // evita duplicar se aparecer 2x na mesma planilha
      if(doInativo){ codigosParaRemoverDosInativos.add(codigo); movidosDeInativos++; }
      novosClientesCriados++;
      marcados++;
    } else {
      naoEncontrados++;
      semVendedorQtd++;
      semVendedorTotal += (valor||0);
    }
  });

  // Quem estava inadimplente e não apareceu nessa lista atualizada: volta a ficar em dia.
  let desmarcados = 0;
  STATE.roster.forEach(c => {
    if(c.inadimplente && !codigosNaLista.has(c.codigo)){
      alteracoes.push({c, novoStatus:false});
      desmarcados++;
    }
  });

  return {
    aplicar: async () => {
      alteracoes.forEach(a => {
        a.c.inadimplente = a.novoStatus;
        if(a.novoStatus){
          a.c.inadimplenteDesde = a.data;
          a.c.inadimplenteObs = a.c.inadimplenteObs || `Importado da lista de inadimplência (${fmtDatePt(a.data)})`;
          if(a.valor !== null) a.c.valorDevido = a.valor;
        } else {
          a.c.inadimplenteDesde = null;
        }
      });
      novosRoster.forEach(n => STATE.roster.push(n));
      await safeSet('crm:roster', STATE.roster);
      if(codigosParaRemoverDosInativos.size > 0){
        const novoPoolInativos = poolInativos.filter(c => !codigosParaRemoverDosInativos.has(c.codigo));
        await safeSet('crm:inativos', novoPoolInativos);
      }
      STATE.config.inadimplenciaNaoCadastrados = {qtd: semVendedorQtd, total: semVendedorTotal, atualizadoEm: todayStr()};
      await safeSet('crm:config', STATE.config);
    },
    resumo: {marcados, desmarcados, naoEncontrados, ignorados, novosClientesCriados, movidosDeInativos, semVendedorQtd, semVendedorTotal, total: linhas.length},
  };
}


async function getContatos(vendedorCodigo){
  if(STATE.contatosCache[vendedorCodigo]) return STATE.contatosCache[vendedorCodigo];
  const data = await safeGet('crm:contatos:'+vendedorCodigo) || {};
  STATE.contatosCache[vendedorCodigo] = data;
  return data;
}
// Registra uma única entrada de contato para um cliente específico (função interna, sem lógica de grupo).
// skusInfo (opcional): {itens:[{codigo,descricao,quantidade}], qtdSkus, qtdUnidades} — vem de um pedido em PDF.
async function registrarEntradaContato(vendedorCodigo, clientCodigo, obs, vendeu, valor, agendarPara, skusInfo){
  const data = await getContatos(vendedorCodigo);
  const hist = data[clientCodigo]?.historico || [];
  hist.unshift({
    id: 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    data: todayStr(),
    obs: obs || '',
    vendeu: !!vendeu,
    valor: vendeu ? (Number(valor)||0) : 0,
    agendou: agendarPara || null,
    skus: (vendeu && skusInfo) ? skusInfo : null,
  });
  data[clientCodigo] = {ultimoContato: todayStr(), historico: hist.slice(0,30), agendadoPara: agendarPara || null};
  STATE.contatosCache[vendedorCodigo] = data;
  await safeSet('crm:contatos:'+vendedorCodigo, data);
}

// ---------------- LEADS ----------------
function leadsDoVendedor(vendedorCodigo){
  return (STATE.leads||[]).filter(l => l.vendedorCodigo === vendedorCodigo);
}
async function salvarLeads(){
  await safeSet('crm:leads', STATE.leads);
}
// Estatísticas de leads pro dashboard: captados (todos) e convertidos (virou cliente E já comprou).
function vendorLeadsStats(vendedorCodigo){
  const leads = leadsDoVendedor(vendedorCodigo);
  const contatos = STATE.contatosCache[vendedorCodigo] || {};
  let convertidos = 0;
  leads.forEach(l => {
    if(l.status === 'convertido' && l.clienteCodigo){
      const reg = contatos[l.clienteCodigo];
      if(reg && reg.historico && reg.historico.some(h=>h.vendeu)) convertidos++;
    }
  });
  return {captados: leads.length, convertidos};
}

// Quantos clientes inadimplentes um vendedor tem, e o total em R$ que eles devem juntos.
function vendorInadimplenciaStats(vendedorCodigo){
  const inadimplentes = clientsForVendor(vendedorCodigo).filter(c => c.inadimplente);
  const total = inadimplentes.reduce((soma,c) => soma + (c.valorDevido||0), 0);
  return {qtd: inadimplentes.length, total};
}

// Retorna a lista de códigos vinculados ao cliente (incluindo ele mesmo), ou null se não tem vínculo.
function grupoDoCliente(codigo){
  const g = (STATE.grupos||[]).find(g => g.membros.includes(codigo));
  return g ? g.membros : null;
}

// Zera histórico de contatos/vendas de TODOS os vendedores e desfaz todos os vínculos de CNPJ.
// Não mexe em clientes, vendedores, leads, inativos, metas ou inadimplência.
async function resetarOperacional(){
  for(const v of STATE.vendors){
    await safeSet('crm:contatos:'+v.codigo, {});
    STATE.contatosCache[v.codigo] = {};
  }
  STATE.grupos = [];
  await safeSet('crm:grupos', []);
}

// Zera a base de clientes por completo: carteiras de todos os vendedores, fila de inativos,
// leads, vínculos de CNPJ, e todo o histórico de contatos/vendas.
// NÃO mexe em metas (são configuração do vendedor, não dado de cliente) nem em contas.
async function zerarBaseCompleta(){
  STATE.roster = [];
  await safeSet('crm:roster', []);
  await safeSet('crm:inativos', []);
  STATE.leads = [];
  await safeSet('crm:leads', []);
  STATE.grupos = [];
  await safeSet('crm:grupos', []);
  for(const v of STATE.vendors){
    await safeSet('crm:contatos:'+v.codigo, {});
    STATE.contatosCache[v.codigo] = {};
  }
  STATE.config.inadimplenciaNaoCadastrados = null;
  await safeSet('crm:config', STATE.config);
}

async function marcarContato(vendedorCodigo, clientCodigo, obs, vendeu, valor, agendarPara, skusInfo){
  const grupo = grupoDoCliente(clientCodigo);
  if(vendeu && grupo && grupo.length > 1){
    // CNPJs vinculados: divide o valor da venda igualmente entre todos e marca todos como contatados.
    const valorRateado = (Number(valor)||0) / grupo.length;
    const nomeOrigem = (STATE.roster.find(c=>c.codigo===clientCodigo)||{}).nome || '';
    for(const membroCodigo of grupo){
      const membro = STATE.roster.find(c=>c.codigo===membroCodigo);
      if(!membro) continue; // esse CNPJ do grupo ainda não está em nenhuma carteira — não dá pra registrar
      const ehOMesmo = membroCodigo === clientCodigo;
      const obsFinal = ehOMesmo ? obs : `Venda rateada automaticamente (CNPJ vinculado a ${nomeOrigem})${obs ? ' — '+obs : ''}`;
      await registrarEntradaContato(membro.vendedorCodigo, membroCodigo, obsFinal, true, valorRateado, ehOMesmo ? agendarPara : null, ehOMesmo ? skusInfo : null);
    }
    return;
  }
  await registrarEntradaContato(vendedorCodigo, clientCodigo, obs, vendeu, valor, agendarPara, skusInfo);
}

async function editarContato(vendedorCodigo, clientCodigo, entryId, obs, vendeu, valor){
  const data = await getContatos(vendedorCodigo);
  const reg = data[clientCodigo];
  if(!reg || !reg.historico) return;
  const idx = reg.historico.findIndex(h => h.id === entryId);
  if(idx === -1) return;
  reg.historico[idx] = {...reg.historico[idx], obs: obs || '', vendeu: !!vendeu, valor: vendeu ? (Number(valor)||0) : 0};
  STATE.contatosCache[vendedorCodigo] = data;
  await safeSet('crm:contatos:'+vendedorCodigo, data);
}

// Remove um pedido/contato específico do histórico (usado pra apagar um pedido lançado errado,
// antes de subir ele de novo corrigido). Some da meta e dos totais do mês automaticamente,
// porque esses números são sempre recalculados a partir do histórico, nunca guardados à parte.
async function excluirEntradaHistorico(vendedorCodigo, clientCodigo, entryId){
  const data = await getContatos(vendedorCodigo);
  const reg = data[clientCodigo];
  if(!reg || !reg.historico) return;
  reg.historico = reg.historico.filter(h => h.id !== entryId);
  STATE.contatosCache[vendedorCodigo] = data;
  await safeSet('crm:contatos:'+vendedorCodigo, data);
}

async function cancelarAgendamento(vendedorCodigo, clientCodigo){
  const data = await getContatos(vendedorCodigo);
  if(data[clientCodigo]) data[clientCodigo].agendadoPara = null;
  STATE.contatosCache[vendedorCodigo] = data;
  await safeSet('crm:contatos:'+vendedorCodigo, data);
}

function isAgendadoFuturo(contatos, codigo){
  const ag = contatos[codigo]?.agendadoPara;
  return !!(ag && ag > todayStr());
}

function clientsForVendor(codigo){
  return STATE.roster.filter(c => c.vendedorCodigo === codigo);
}

function vendorPhotoSrc(v){

  return v.foto || VENDOR_PHOTOS[v.codigo] || null;

// Número do vendedor visível — usamos o próprio código de cadastro como "número".
function vendorNumero(v){

// Nome do vendedor a partir do código (usado em rótulos rápidos, tipo "atual: Fulano").
function vendorNome(codigo){

}

// Lê um arquivo de imagem escolhido pelo usuário e devolve uma versão comprimida (JPEG, base64) pronta pra guardar.
function resizeImagemParaBase64(file, maxDim=280, quality=0.82){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Arquivo não é uma imagem válida'));
      img.onload = () => {
        let {width, height} = img;
        if(width > height){
          if(width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; }
        } else {
          if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Lê um PDF de pedido/nota e pede pra IA extrair o valor total e a lista de SKUs/quantidades.
function lerPdfComoBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}
async function extrairPedidoDoPdf(file){
  const base64 = await lerPdfComoBase64(file);
  const prompt = 'Analise este PDF de pedido/nota de venda. Pode ter ate 20 paginas e centenas de itens — leia o documento inteiro, todas as paginas, sem pular nada. Responda APENAS com um JSON valido, compacto, sem espacos desnecessarios, sem nenhum texto antes ou depois, sem comentarios, exatamente neste formato: {"valorTotal":0,"itens":[["codigo","descricao curta",0]]}. Cada item da lista "itens" e um array com 3 posicoes, nessa ordem: [0]=codigo do produto (coluna "Produto" ou "Codigo"), [1]=descricao BEM RESUMIDA do produto (no maximo 35 caracteres, corte se precisar), [2]=quantidade vendida (numero). valorTotal e o valor final do pedido em reais (o total que o cliente vai pagar — geralmente chamado de "Valor Liquido", "Valor Total" ou "Total Geral" no documento; se nao existir esse campo, use o total de mercadorias), como numero puro (sem R$, sem ponto de milhar, ponto para casas decimais). Inclua TODOS os itens de TODAS as paginas do pedido, sem excecao, mesmo que a lista tenha centenas de linhas. Se nao identificar o codigo de algum item, use "?" nesse campo, mas sempre inclua a linha.';
  // Chama nossa própria função no Vercel (api/analisar-pedido.js), que guarda a chave da Anthropic
  // em segredo no servidor — o navegador do vendedor nunca vê essa chave.
  const response = await fetch('/api/analisar-pedido', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ base64, prompt }),
  });
  const data = await response.json();
  if(!response.ok) throw new Error(data?.error || 'Erro ao processar o PDF (tente novamente).');
  const textBlock = (data.content||[]).find(b => b.type === 'text');
  if(!textBlock) throw new Error('Não consegui ler o conteúdo do PDF.');
  let clean = textBlock.text.replace(/```json|```/g,'').trim();
  let parsed;
  try{
    parsed = JSON.parse(clean);
  }catch(e){
    // Se a resposta veio com texto extra em volta, tenta pegar só o trecho entre a primeira { e a última }.
    const inicio = clean.indexOf('{');
    const fim = clean.lastIndexOf('}');
    if(inicio === -1 || fim === -1 || fim <= inicio){
      throw new Error('Não consegui interpretar os dados do pedido. Tente um PDF mais legível.');
    }
    try{
      parsed = JSON.parse(clean.slice(inicio, fim+1));
    }catch(e2){
      throw new Error('A resposta veio incompleta (pedido muito grande?). Tente novamente — se persistir, divida o PDF em partes menores.');
    }
  }
  const itensRaw = Array.isArray(parsed.itens) ? parsed.itens : [];
  const itens = itensRaw.map(i => {
    if(Array.isArray(i)){
      return {codigo: i[0] || '—', descricao: i[1] || '', quantidade: Number(i[2]) || 0};
    }
    return {codigo: i.codigo || '—', descricao: i.descricao || '', quantidade: Number(i.quantidade) || 0};
  });
  return {
    valorTotal: Number(parsed.valorTotal) || 0,
    itens,
  };
}

// Monta a linha "Comprado / Limite / Disponível" a partir de um objeto com limiteCredito/saldoDevedor.
function creditoLineHTML(c){
  if(!c || c.limiteCredito === null || c.limiteCredito === undefined) return '';
  const comprado = Math.max(0, c.saldoDevedor||0);
  const disponivel = Math.max(0, c.limiteCredito - (c.saldoDevedor||0));
  return `
    <div class="credito-line">
      <span>Comprado: <b>${fmtMoney(comprado)}</b></span>
      <span>Limite: <b>${fmtMoney(c.limiteCredito)}</b></span>
      <span class="${disponivel<=0?'credito-zerado':''}">Disponível: <b>${fmtMoney(disponivel)}</b></span>
    </div>
  `;
}

// Aggregates all contact + sale activity for a vendor in the current calendar month.
function vendorMonthStats(vendedorCodigo, mesChave){
  mesChave = mesChave || STATE.mesSelecionado || currentMonthKey();
  const mesEhAtual = mesChave === currentMonthKey();
  const clientes = clientsForVendor(vendedorCodigo);
  const contatos = STATE.contatosCache[vendedorCodigo] || {};
  const mk = mesChave;
  let contatadosMes = 0, numVendas = 0, valorVendas = 0, totalUnidades = 0;
  const skuCodesUnicos = new Set();
  const skusDetalheMap = new Map(); // codigo -> {codigo, descricao, quantidade}
  const atividade = [];
  const agendamentos = [];
  const agendamentosHoje = [];
  const clientesPositivados = new Set();
  let atrasados = 0;
  clientes.forEach(c => {
    const reg = contatos[c.codigo];
    if(statusFor(reg?.ultimoContato) === 'danger') atrasados++;
    if(!reg) return;
    const tocouEsteMes = (reg.historico||[]).some(h => h.data.slice(0,7)===mk);
    if(tocouEsteMes) contatadosMes++;
    if(mesEhAtual && reg.agendadoPara && reg.agendadoPara > todayStr()){
      agendamentos.push({nome:c.nome, codigo:c.codigo, data:reg.agendadoPara});
    }
    if(mesEhAtual && reg.agendadoPara === todayStr()){
      agendamentosHoje.push({nome:c.nome, codigo:c.codigo, contato:c.contato, telefone:c.telefone});
    }
    (reg.historico||[]).forEach(h => {
      if(h.data.slice(0,7)===mk){
        atividade.push({nome:c.nome, codigo:c.codigo, id:h.id, data:h.data, obs:h.obs, vendeu:h.vendeu, valor:h.valor, skus:h.skus||null});
        if(h.vendeu){
          numVendas++; valorVendas += (h.valor||0); clientesPositivados.add(c.codigo);
          // SKU distinto conta só 1x no mês, mesmo vendido pra vários clientes — unidades somam normal.
          if(h.skus && h.skus.itens){
            h.skus.itens.forEach(item => {
              const cod = (item.codigo||'').trim().toUpperCase();
              if(cod && cod !== '—' && cod !== '?'){
                skuCodesUnicos.add(cod);
                const atual = skusDetalheMap.get(cod) || {codigo: cod, descricao: item.descricao||'', quantidade: 0};
                atual.quantidade += (item.quantidade||0);
                if(item.descricao && !atual.descricao) atual.descricao = item.descricao;
                skusDetalheMap.set(cod, atual);
              }
              totalUnidades += (item.quantidade||0);
            });
          }
        }
      }
    });
  });
  const totalSkus = skuCodesUnicos.size;
  const skusVendidosDetalhe = Array.from(skusDetalheMap.values()).sort((a,b) => b.quantidade - a.quantidade);
  atividade.sort((a,b) => a.data < b.data ? 1 : -1);
  agendamentos.sort((a,b) => a.data < b.data ? -1 : 1);
  const wd = mesEhAtual ? todayWeekday() : 0;
  const hojeList = wd ? clientes.filter(c=>c.diaSemana===wd && !isAgendadoFuturo(contatos, c.codigo)) : [];
  const hojeFeitos = hojeList.filter(c => contatos[c.codigo]?.ultimoContato === todayStr()).length;
  const vendor = STATE.vendors.find(v=>v.codigo===vendedorCodigo);
  const metaVendas = vendor ? (vendor.metaMes || 0) : 0;
  // clientes com limite de crédito disponível que ainda não compraram este mês (oportunidade de upsell)
  const naoPositivadosComCredito = mesEhAtual ? clientes
    .filter(c => !clientesPositivados.has(c.codigo) && c.limiteCredito !== null && c.limiteCredito !== undefined)
    .map(c => ({c, disponivel: c.limiteCredito - (c.saldoDevedor||0)}))
    .filter(x => x.disponivel > 0)
    .sort((a,b) => b.disponivel - a.disponivel) : [];
  const comCreditoNaoPositivado = naoPositivadosComCredito.length;
  const clientesPotencial = naoPositivadosComCredito.slice(0,5).map(x => ({
    nome: x.c.nome, codigo: x.c.codigo, contato: x.c.contato, telefone: x.c.telefone,
    disponivel: x.disponivel, diasSemContato: daysBetween(contatos[x.c.codigo]?.ultimoContato),
  }));
  const devedores = clientes.filter(c => c.inadimplente).length;
  return {
    mesChave, mesEhAtual,
    totalClientes: clientes.length,
    contatadosMes,
    pctMeta: clientes.length ? Math.round(contatadosMes/clientes.length*100) : 0,
    numVendas, valorVendas,
    metaVendas, pctMetaVendas: metaVendas ? Math.min(100, Math.round(valorVendas/metaVendas*100)) : 0,
    positivados: clientesPositivados.size,
    pctPositivacao: clientes.length ? Math.round(clientesPositivados.size/clientes.length*100) : 0,
    hojeTotal: hojeList.length, hojeFeitos,
    atividade, agendamentos, agendamentosHoje,
    atrasados, comCreditoNaoPositivado, clientesPotencial, devedores, totalSkus, totalUnidades, skusVendidosDetalhe,
  };
}

// Lista os últimos 12 meses (mais recente primeiro) pro seletor de mês.
function mesesDisponiveis(){
  const hoje = new Date();
  const meses = [];
  for(let i=0;i<12;i++){
    const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
    const chave = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    let label = d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    label = label.charAt(0).toUpperCase()+label.slice(1);
    meses.push({chave, label});
  }
  return meses;
}
function mesSeletorHTML(id){
  const meses = mesesDisponiveis();
  const atual = STATE.mesSelecionado || currentMonthKey();
  return `<select class="filter-select" id="${id}">${meses.map(m=>`<option value="${m.chave}" ${m.chave===atual?'selected':''}>${m.label}</option>`).join('')}</select>`;
}

// Calcula em que ponto do mês estamos e compara com a média dos indicadores do vendedor.
function progressoDoMes(s){
  const hoje = new Date();
  const diaAtual = hoje.getDate();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  const pctMesPassado = Math.round((diaAtual/diasNoMes)*100);
  const indicadores = [s.pctMeta, s.pctPositivacao, s.pctMetaVendas];
  const pctMedioIndicadores = Math.round(indicadores.reduce((a,b)=>a+b,0)/indicadores.length);
  const diff = pctMedioIndicadores - pctMesPassado;
  let tom, mensagem;
  if(diff <= -15){
    tom = 'danger';
    mensagem = `Estamos em ${pctMesPassado}% do mês (dia ${diaAtual} de ${diasNoMes}) e seus indicadores médios estão em ${pctMedioIndicadores}%. Precisa acelerar — hora de ser mais agressivo nos contatos e nas ofertas de hoje.`;
  } else if(diff < 0){
    tom = 'warn';
    mensagem = `Estamos em ${pctMesPassado}% do mês e seus indicadores estão em ${pctMedioIndicadores}%. Está um pouco abaixo do ritmo — vale reforçar os contatos nos próximos dias.`;
  } else {
    tom = 'ok';
    mensagem = `Estamos em ${pctMesPassado}% do mês e seus indicadores já estão em ${pctMedioIndicadores}%. Ritmo bom — continue assim.`;
  }
  return {diaAtual, diasNoMes, pctMesPassado, pctMedioIndicadores, tom, mensagem};
}

// Gera dicas de vendas para o dia com base nos números atuais da carteira.
function dicasDoDia(s){
  const dicas = [];
  if(s.agendamentosHoje.length > 0){
    dicas.push(`Você tem ${s.agendamentosHoje.length} retorno(s) agendado(s) para hoje — priorize esses contatos antes do resto da lista.`);
  }
  if(s.atrasados > 0){
    dicas.push(`${s.atrasados} cliente(s) estão há mais de 30 dias sem contato — uma oferta de reativação (desconto ou condição especial de primeira compra) ajuda a trazer eles de volta.`);
  }
  if(s.comCreditoNaoPositivado > 0){
    dicas.push(`${s.comCreditoNaoPositivado} cliente(s) têm limite de crédito disponível e ainda não compraram este mês — veja a lista de "Clientes com potencial hoje" acima e ofereça condições de prazo maior pra destravar esse crédito parado.`);
  }
  if(s.metaVendas > 0 && s.valorVendas < s.metaVendas){
    const falta = s.metaVendas - s.valorVendas;
    dicas.push(`Faltam ${fmtMoney(falta)} para bater a meta do mês — negociar combos ou aumentar o ticket médio dos próximos pedidos ajuda a fechar essa conta mais rápido.`);
  }
  if(s.pctPositivacao < 50){
    dicas.push(`A positivação está abaixo de 50% — foque em fechar pedidos pequenos com quem já demonstrou interesse antes de correr atrás de clientes novos.`);
  }
  if(dicas.length === 0){
    dicas.push('Carteira em dia e indicadores no rumo certo — continue com o ritmo de contatos de hoje.');
  }
  return dicas;
}

function renderLogin(){
  app.innerHTML = `

        return;
      }
      const usuarioGerente = (STATE.config && STATE.config.usuarioGerente) || GERENTE_USUARIO_PADRAO;
      if(user === usuarioGerente){
        const senhaGerente = (STATE.config && STATE.config.senhaGerente) || GERENTE_SENHA_PADRAO;

      const diretor = (STATE.diretores||[]).find(d => d.usuario === user);

        if(diretor.senha === pass){
          STATE.session = {tipo:'gerente', nome: diretor.nome}; STATE.route={page:'visao-geral'}; STATE.mesSelecionado = currentMonthKey(); render();
        } else {
          errSlot.innerHTML = `<div class="login-error">Senha incorreta.</div>`;
        }
        return;
      }
      const vendors = STATE.vendors || [];
      const v = vendors.find(v => v.usuario === user);

        STATE.session = {tipo:'vendedor', codigo:v.codigo, nome:v.nome};

        STATE.mesSelecionado = currentMonthKey();
        render();
      } else {

      }
    }catch(err){
      errSlot.innerHTML = `<div class="login-error">Erro ao entrar: ${err.message}</div>`;
    }

  document.getElementById('loginUser').addEventListener('keydown', (e) => { if(e.key==='Enter') doLogin(); });

}

  else if(STATE.route.page==='hoje') renderVendorHoje(main);
  else if(STATE.route.page==='carteira') renderVendorCarteira(main);
  else if(STATE.route.page==='leads') renderVendorLeads(main);
  else if(STATE.route.page==='inativos') await renderVendorInativos(main);
  else renderVendorHistorico(main);
}

async function renderVendorInativos(main){
  main.innerHTML = `<div class="loading" style="min-height:200px">Carregando…</div>`;
  const poolTodos = await getInativos();
  const pool = poolTodos.filter(c => daysBetween(c.ultimaCompra) > 120);
  main.innerHTML = `
    <div class="page-header"><div class="eyebrow">Clientes inativos</div><h2>Clientes sem vendedor</h2></div>
    <p style="font-size:13px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;">Clientes com CNPJ cadastrado, pelo menos uma compra no sistema e sem comprar há mais de 120 dias, sem vendedor responsável hoje. Assim que você marcar um contato aqui, o cliente entra automaticamente na sua carteira.</p>
    <div class="toolbar">
      <input type="text" class="search-input" id="busca" placeholder="Buscar por nome, cidade, CNPJ ou contato...">
    </div>
    <div id="contagem" style="font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;"></div>
    <div class="client-list" id="lista"></div>
  `;
  function draw(){
    const q = document.getElementById('busca').value.trim().toLowerCase();
    let filtered = pool.filter(c => {
      return !q || c.nome.toLowerCase().includes(q) || (c.municipio||'').toLowerCase().includes(q) || (c.cnpj||'').includes(q) || (c.contato||'').toLowerCase().includes(q);
    });
    filtered.sort((a,b) => a.ultimaCompra < b.ultimaCompra ? 1 : -1);
    document.getElementById('contagem').textContent = `${filtered.length} cliente(s) sem vendedor (sem comprar há mais de 120 dias)`;
    const lista = document.getElementById('lista');
    if(filtered.length===0){ lista.innerHTML = `<div class="empty-state">Nenhum cliente inativo encontrado.</div>`; return; }
    lista.innerHTML = filtered.slice(0,150).map(c => {
      const temCredito = c.limiteCredito !== null && c.limiteCredito !== undefined;
      const disponivel = temCredito ? Math.max(0, c.limiteCredito - (c.saldoDevedor||0)) : 0;
      return `
      <div class="client-row" data-codigo="${c.codigo}">
        <div class="client-info">
          <div class="client-name client-name-link" data-codigo="${c.codigo}">${c.nome} <span class="client-num">Nº ${c.codigo}</span></div>
          <div class="client-meta">
            <span>${c.municipio || ''}${c.uf ? '/'+c.uf : ''}</span>
            <span>CNPJ: ${c.cnpj}</span>
            ${c.contato ? `<span>${c.contato}</span>` : ''}
            ${c.telefone ? `<a href="tel:${c.telefone.replace(/\D/g,'')}">${c.telefone}</a>` : ''}
          </div>
          ${temCredito ? `
            <div class="credito-line">
              <span>Comprado: <b>${fmtMoney(Math.max(0,c.saldoDevedor||0))}</b></span>
              <span>Limite: <b>${fmtMoney(c.limiteCredito)}</b></span>
              <span class="${disponivel<=0?'credito-zerado':''}">Disponível: <b>${fmtMoney(disponivel)}</b></span>
            </div>
          ` : ''}
        </div>
        <span class="day-pill">Última compra: ${fmtDatePt(c.ultimaCompra)}${c.ultimaCompra ? ` (há ${daysBetween(c.ultimaCompra)}d)` : ""}</span>
        <button class="check-btn claim-btn" data-codigo="${c.codigo}">Contatar e adicionar à minha carteira</button>
      </div>
    `;}).join('');
    bindClientNameLinks(lista);
    lista.querySelectorAll('.claim-btn').forEach(btn=>{
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = 'Adicionando...';
        const novo = await reivindicarClienteInativo(STATE.session.codigo, Number(btn.dataset.codigo));
        if(!novo){
          await avisar('Esse cliente acabou de ser pego por outro vendedor. Atualize a lista.');
          renderVendorShell();
          return;
        }
        openContatoModal(novo.codigo);
      };
    });
  }
  document.getElementById('busca').oninput = draw;
  draw();
}

function renderVendorHoje(main){
  const wd = todayWeekday();
  const contatos = STATE.contatosCache[STATE.session.codigo] || {};
  const meusClientes = clientsForVendor(STATE.session.codigo);
  const dataToday = new Date();
  const dataFmt = dataToday.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});

  const leadsHoje = leadsDoVendedor(STATE.session.codigo)
    .filter(l => l.status !== 'convertido' && l.agendadoPara <= todayStr())
    .sort((a,b) => a.agendadoPara < b.agendadoPara ? -1 : 1);
  const leadsPanelHTML = leadsHoje.length===0 ? '' : `
    <div class="panel" style="border-color:var(--accent);">
      <h3>Leads para contatar</h3>
      <p class="hint">Prospecções com retorno agendado pra hoje (ou atrasadas).</p>
      <div class="client-list">
        ${leadsHoje.map(l => `
          <div class="client-row status-warn">
            <div class="client-info">
              <div class="client-name">${l.empresa}</div>
              <div class="client-meta">
                ${l.telefone ? `<a href="tel:${l.telefone.replace(/\D/g,'')}">${l.telefone}</a>` : ''}
                ${l.cnpj ? `<span>CNPJ: ${l.cnpj}</span>` : ''}
              </div>
            </div>
            <span class="day-pill">Retorno: ${fmtDatePt(l.agendadoPara)}</span>
            <button class="ghost-btn registrarContatoLeadBtn" data-id="${l.id}">Registrar contato</button>
            <button class="check-btn converterLeadBtn" data-id="${l.id}">Converter em cliente</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  function bindLeadsPanel(){
    main.querySelectorAll('.registrarContatoLeadBtn').forEach(btn=>{
      btn.onclick = () => abrirRegistrarContatoLeadModal(btn.dataset.id);
    });
    main.querySelectorAll('.converterLeadBtn').forEach(btn=>{
      btn.onclick = () => abrirConverterLeadModal(btn.dataset.id);
    });
  }

  if(wd === 0){
    const atrasados = meusClientes.filter(c => statusFor(contatos[c.codigo]?.ultimoContato) === 'danger').length;
    main.innerHTML = `
      <div class="page-header">
        <div class="eyebrow display" style="text-transform:capitalize">${dataFmt}</div>
        <h2>Fim de semana</h2>
      </div>
      ${leadsPanelHTML}
      <div class="panel">
        <h3>Sem contatos hoje</h3>
        <p class="hint">Os contatos diários rodam de segunda a sexta. ${atrasados > 0 ? `Você tem <b>${atrasados}</b> cliente(s) atrasado(s) — dá pra adiantar pela aba "Carteira completa".` : 'Sua carteira está em dia. Bom descanso.'}</p>
        <button class="ghost-btn" id="ver-carteira">Ver carteira completa</button>
      </div>
    `;
    document.getElementById('ver-carteira').onclick = () => { STATE.route={page:'carteira'}; renderVendorShell(); };
    bindLeadsPanel();
    return;
  }

  let hoje = meusClientes.filter(c => {
    const ag = contatos[c.codigo]?.agendadoPara;
    if(ag === todayStr()) return true; // retorno marcado exatamente para hoje, foge do dia normal
    if(ag && ag > todayStr()) return false; // retorno futuro, some da lista até lá
    return c.diaSemana === wd;
  });
  hoje = hoje.map(c => ({...c, status: statusFor(contatos[c.codigo]?.ultimoContato), ultimoContato: contatos[c.codigo]?.ultimoContato, agendadoPara: contatos[c.codigo]?.agendadoPara}));
  hoje.sort((a,b) => daysBetween(b.ultimoContato) - daysBetween(a.ultimoContato));
  const feitos = hoje.filter(c => c.ultimoContato === todayStr()).length;
  const pct = hoje.length ? Math.round(feitos/hoje.length*100) : 0;
  const adiados = meusClientes.filter(c => c.diaSemana === wd && isAgendadoFuturo(contatos, c.codigo)).length;

  main.innerHTML = `
    <div class="page-header">
      <div class="eyebrow display" style="text-transform:capitalize">${dataFmt}</div>
      <h2>Contatos de ${DIAS[wd]}</h2>
    </div>
    ${leadsPanelHTML}
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
        <span style="font-size:13px; color:var(--ink-soft); font-weight:600;">${feitos} de ${hoje.length} contatados hoje</span>
        <span style="font-size:13px; color:var(--ink-soft);">${pct}%</span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      ${adiados>0 ? `<p class="hint" style="margin-top:10px; margin-bottom:0;">${adiados} cliente(s) de hoje estão com retorno agendado e não aparecem na lista.</p>` : ''}
    </div>
    <div class="client-list" id="lista"></div>
  `;
  bindLeadsPanel();
  const lista = document.getElementById('lista');
  if(hoje.length===0){
    lista.innerHTML = `<div class="empty-state">Nenhum cliente designado para hoje.</div>`;
    return;
  }
  lista.innerHTML = hoje.map(c => clientRowHTML(c, c.status, c.ultimoContato===todayStr(), false, true)).join('');
  bindClientRows(lista);
}

  main.innerHTML = `

    </div>
    <div class="toolbar">
      <input type="text" class="search-input" id="busca" placeholder="Buscar por nome, número, cidade ou contato...">
      <select class="filter-select" id="filtroStatus">

        <option value="danger">Atrasados</option>
        <option value="warn">Atenção</option>
        <option value="ok">Em dia</option>
      </select>
      <select class="filter-select" id="filtroCompra">
        <option value="">Comprou ou não este mês</option>
        <option value="comprou">Já comprou este mês</option>
        <option value="nao-comprou">Ainda não comprou este mês</option>
      </select>
    </div>
    <div class="client-list" id="lista"></div>
  `;

  document.getElementById('btnLimparCarteira').onclick = async () => {
    const numClientes = clientsForVendor(STATE.session.codigo).length;
    if(numClientes === 0){
      await avisar('Sua carteira já está vazia.');
      return;
    }
    const confirmou = await confirmarAcao(`Isso vai mover TODOS os seus ${numClientes} cliente(s) pra fila de "Clientes inativos". Ninguém é apagado, só desvinculado — outro vendedor (ou você de novo) pode assumir depois. Use isso antes de subir uma base nova, se quiser começar do zero. Continuar?`);
    if(!confirmou) return;
    const resultado = await esvaziarCarteiraDoVendedor(STATE.session.codigo);
    await avisar(`${resultado.movidos} cliente(s) foram movidos pra "Clientes inativos". Sua carteira está vazia agora.`);
    renderVendorShell();
  };
  function draw(){
    const q = document.getElementById('busca').value.trim().toLowerCase();
    const f = document.getElementById('filtroStatus').value;
    const fc = document.getElementById('filtroCompra').value;
    let filtered = meusClientes.filter(c => {
      const matchQ = !q || c.nome.toLowerCase().includes(q) || (c.municipio||'').toLowerCase().includes(q) || (c.contato||'').toLowerCase().includes(q) || String(c.codigo).includes(q);
      const st = statusFor(c.ultimoContato);
      const matchF = !f || st===f;
      const comprouMes = valorCompradoMesCliente(c) > 0;
      const matchFc = !fc || (fc==='comprou' ? comprouMes : !comprouMes);
      return matchQ && matchF && matchFc;
    });
    filtered.sort((a,b) => daysBetween(b.ultimoContato) - daysBetween(a.ultimoContato));
    const lista = document.getElementById('lista');
    if(filtered.length===0){ lista.innerHTML = `<div class="empty-state">Nenhum cliente encontrado.</div>`; return; }
    lista.innerHTML = filtered.map(c => clientRowHTML(c, statusFor(c.ultimoContato), c.ultimoContato===todayStr(), true, true)).join('');
    bindClientRows(lista);
  }
  document.getElementById('busca').oninput = draw;
  document.getElementById('filtroStatus').onchange = draw;
  document.getElementById('filtroCompra').onchange = draw;
  draw();
}

// Quanto um cliente já comprou este mês (soma das vendas registradas no CRM, considerando rateio de grupo).
function valorCompradoMesCliente(c){
  const contatosVendedor = c.vendedorCodigo ? (STATE.contatosCache[c.vendedorCodigo] || {}) : {};
  const mk = currentMonthKey();
  let total = 0;
  if(contatosVendedor[c.codigo] && contatosVendedor[c.codigo].historico){
    contatosVendedor[c.codigo].historico.forEach(h => {
      if(h.vendeu && h.data && h.data.slice(0,7)===mk) total += (h.valor||0);
    });
  }
  return total;
}

// Meta sugerida automaticamente: baseada no limite de crédito do cliente (potencial dele).
// Sem dado de limite, cai num valor padrão baixo, só pra ter um alvo.
function metaSugeridaCliente(c){
  if(c.limiteCredito !== null && c.limiteCredito !== undefined && c.limiteCredito > 0){
    return Math.max(300, Math.round((c.limiteCredito * 0.15) / 50) * 50);
  }
  return 500;
}
// Meta em uso: a que o vendedor definiu manualmente, ou a sugerida se ele nunca mexeu.
function metaClienteAtual(c){
  return (c.metaCliente !== undefined && c.metaCliente !== null && c.metaCliente > 0) ? c.metaCliente : metaSugeridaCliente(c);
}
